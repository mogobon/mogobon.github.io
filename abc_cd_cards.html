<script type="application/json" id="dataset">[{"id":"abc483_c","title":"C - Second Choice Election","url":"https://atcoder.jp/contests/abc483/tasks/abc483_c?lang=ja","summary":"\u003cp>AtCoder 村で村長を決める投票を行うことになりました。 候補者は N 人おり、候補者 1 , 候補者 2 , \\ldots , 候補者 N と番号づけられています。 投票者は M 人おり、 i 人目 (1\\leq i\\leq M) の投票者の投票先の第一希望は候補者 A_i 、第二希望は候補者 B_i です。 問：k=1,2,\\ldots,N それぞれについて、候補者 k のみが辞退した場合に当選する候補者の番号を求めてください。 条件：第一希望の候補者が辞退していなければ、第一希望の候補者に投票する。 / 第一希望の候補者が辞退していれば、第二希望の候補者に投票する。\u003c/p>"},{"id":"abc483_d","title":"D - Glitchy Robot","url":"https://atcoder.jp/contests/abc483/tasks/abc483_d?lang=ja","summary":"\u003cp>数直線上にロボットがいます。はじめ、ロボットは座標 0 にいます。 また、高橋君は長さ N の整数列 A=(A_1,A_2,\\ldots,A_N) を持っています。 高橋君は次の操作を行います。 問：高橋君はロボットが一度以上通る整数座標の個数をなるべく多くしたいです。 高橋君が最適に行動したときの、「ロボットが一度以上通る整数座標の個数」としてあり得る最大の値を求めてください。 条件：A の要素を 高々 1 つ 選び、その符号を反転させる。すなわち、 1\\leq i\\leq N をみたす i を 0 または 1 つ選び、 A_i を -A_i に書き換える。 / ロボットを起動する。ロボットは起動後、 N 回の行動を行う。\u003c/p>"},{"id":"abc482_c","title":"C - Band Count","url":"https://atcoder.jp/contests/abc482/tasks/abc482_c?lang=ja","summary":"\u003cp>縦 H マス、横 W マスのグリッドがあります。上から i 行目、左から j 列目のマスを (i,j) と呼びます。 グリッドには N 個の駒が置かれており、 i 番目の駒は (R_i, C_i) にあります。 Q 個のクエリに答えてください。クエリは以下の 2 種類です。 条件：1 u d ： u 行目から d 行目までに置かれている駒の個数を出力する。 / 2 l r ： l 列目から r 列目までに置かれている駒の個数を出力する。\u003c/p>"},{"id":"abc482_d","title":"D - Wannabe Zombie","url":"https://atcoder.jp/contests/abc482/tasks/abc482_d?lang=ja","summary":"\u003cp>数直線上に人 1,2,\\dots,N の N 人が立っています。 人 i が立っている座標は X_i です。 ここで i=1,2,\\dots,N に対して X_i は偶数であり、 X_1 &lt; X_2 &lt; \\cdots &lt; X_N を満たします。 各 k=1,2,\\dots,N について、以下の問題を解いてください。 問：なおこの問題の制約下において、求める答えは整数になることが証明できます。\u003c/p>"},{"id":"abc481_c","title":"C - Bank Accounts","url":"https://atcoder.jp/contests/abc481/tasks/abc481_c?lang=ja","summary":"\u003cp>コワスギ銀行の裏庭では、幽霊がカボチャを育てています。あなたはカボチャたちに銀行口座を開設してあげることにしました。 問：カボチャ用銀行口座には、開設時に名前と ID を 1 個ずつ割り当てます。ID の値を選ぶときは、まだ ID として使われていない正の整数のうち最小のものを採用します。 条件：カボチャがやってきて、名前 s を名乗る。 名前 s が割り当てられた口座が存在する場合、その ID を出力する。 名前 s が割り当てられた口座が存在しない場合、名前 s の口座を新規に 1 個開設し、その ID を出力する。\u003c/p>"},{"id":"abc481_d","title":"D - Autopilot","url":"https://atcoder.jp/contests/abc481/tasks/abc481_d?lang=ja","summary":"\u003cp>N 個の惑星と M 本の航路があります。惑星には 1 から N までの、航路には 1 から M までの番号が付けられています。 航路 i は惑星 A_i から惑星 B_i へと結ばれています。各航路は一方通行です。 問：宇宙船が惑星 S から出発して惑星 T に到着するまでに消費する燃料の量の最小値を求めてください。到達が不可能な場合は代わりに -1 を出力してください。 条件：今いる惑星から航路が直接結ばれた惑星のうち、番号が最小の惑星に、燃料を消費せずに移動する。 / 今いる惑星から航路が直接結ばれた惑星を好きに選び、燃料を 1 消費して選んだ惑星に移動する。\u003c/p>"},{"id":"abc480_c","title":"C - Self-Stopping Shower","url":"https://atcoder.jp/contests/abc480/tasks/abc480_c?lang=ja","summary":"\u003cp>高橋君は銭湯のシャワーを使っています。 このシャワーにはボタンがあります。 時刻 t にボタンを押すと時刻 t から時刻 t+K までの K 秒間お湯が出ます。 お湯が出ているときに再びボタンを押した場合も、最後にボタンを押した時刻から K 秒間お湯が出ます。 N 人の青木君がいて、ボタンを 1 回ずつ押してくれます。 i 人目の青木君は時刻 A_i にボタンを押します。 問：時刻 0 から時刻 T までの間に常にお湯が出ているようにするために高橋君は最小で何回ボタンを押す必要があるかを求めてください。 ただし、ボタンを押したタイミングと最後にボタンを押してからちょうど K 秒経ったタイミングはいずれもお湯が出ているものとします。\u003c/p>"},{"id":"abc480_d","title":"D - Concatenation of Prefixes","url":"https://atcoder.jp/contests/abc480/tasks/abc480_d?lang=ja","summary":"\u003cp>長さ N の整数列 (A_1,\\dots,A_N) が与えられます。 以下の手順で長さ \\frac{N(N+1)}{2} の数列 B を作ります。 問：質問： L,R が与えられる。 B_L+B_{L+1}+\\dots+B_R を求めよ。 条件：最初、 B を空列とする。 / i=1,2,\\dots,N の順に、 B の末尾に (A_1,\\dots,A_i) を連結する。\u003c/p>"},{"id":"abc479_c","title":"C - Bento Packing","url":"https://atcoder.jp/contests/abc479/tasks/abc479_c?lang=ja","summary":"\u003cp>N 個のおかずがあります。 i 個目のおかずのおいしさは A_i 、体積は B_i です。 問：選んだおかずのおいしさの総和として考えられる最大値を求めてください。\u003c/p>"},{"id":"abc479_d","title":"D - Back and Forth Distance","url":"https://atcoder.jp/contests/abc479/tasks/abc479_d?lang=ja","summary":"\u003cp>N 個のマスが一直線上に並んでおり、左から順に 1, 2, \\ldots, N の番号が付いています。 あなたがマス i にいるとき、以下のいずれかの移動をすることができます。 問：Q 個のクエリが与えられます。それぞれについて答えてください。各クエリは以下の形式です。 条件：1 \\leq j &lt; i なる整数 j を選び、マス j に移動する。この移動にはコストが L_i かかる。 / i &lt; j \\leq N なる整数 j を選び、マス j に移動する。この移動にはコストが R_i かかる。\u003c/p>"},{"id":"abc478_c","title":"C - Sort Subarray","url":"https://atcoder.jp/contests/abc478/tasks/abc478_c?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A _ 1,A _ 2,\\ldots,A _ N) が与えられます。 A に対して、次の操作を ちょうど \\mathbf{1} 回 行います。 問：この操作ののち、 A が昇順になっている、つまりすべての 1\\le i\\lt N に対して A _ i\\le A _ {i+1} が成り立っているようにできるか判定してください。 条件：1 以上 N-K+1 以下の整数 i をひとつ選ぶ。 A _ i,A _ {i+1},\\ldots,A _ {i+K-1} を昇順にソートする。\u003c/p>"},{"id":"abc478_d","title":"D - Range Set Insertion Query","url":"https://atcoder.jp/contests/abc478/tasks/abc478_d?lang=ja","summary":"\u003cp>N 個の集合 S _ 1,S _ 2,\\ldots,S _ N があります。 はじめ、 S _ 1,S _ 2,\\ldots,S _ N はすべて空集合です。 これらの集合に対して、以下のような操作を Q 回行います。 i 番目 (1\\le i\\le Q) の操作では、整数の 3 つ組 (L _ i,R _ i,X _ i) が与えられ、以下の操作を行います。 問：すべての操作を終えたあとの S _ i の要素数を、すべての i=1,2,\\ldots,N に対して求めてください。 条件：S _ {L _ i},S _ {L _ i+1},\\ldots,S _ {R _ i} に対して、 X _ i を追加する。\u003c/p>"},{"id":"abc477_c","title":"C - Range Search Query","url":"https://atcoder.jp/contests/abc477/tasks/abc477_c?lang=ja","summary":"\u003cp>文字列 S, T が与えられます。 Q 個のクエリを処理してください。 クエリでは L, R が与えられるので、 S の L 文字目から R 文字目までからなる部分文字列に、 T が部分文字列として含まれるかを判定してください。\u003c/p>"},{"id":"abc477_d","title":"D - Masking Tape","url":"https://atcoder.jp/contests/abc477/tasks/abc477_d?lang=ja","summary":"\u003cp>N 個のマスが横一列に並んでおり、左から順にマス 1 からマス N までの番号がついています。色は英小文字で表されます。 はじめ、すべてのマスの色は a で、各マスには何も置かれていません。 問：すべてのクエリを処理した後の各マスの色を（タイルが置かれているかどうかにかかわらず）求めてください。 条件：1 X : マス X にタイルが置かれていなければタイルを置き、置かれていれば取り除く。 / 2 C : タイルが置かれていないすべてのマスの色を C に変更する。\u003c/p>"},{"id":"abc476_c","title":"C - Third Largest Number","url":"https://atcoder.jp/contests/abc476/tasks/abc476_c?lang=ja","summary":"\u003cp>3 以上の整数 N と長さ N の正整数列 A=(A_1,A_2,\\ldots,A_N) が与えられます。 問：k=3,4,\\ldots,N それぞれに対し以下の問題を解いてください： 条件：A_1,A_2,\\ldots,A_k を降順に並べたとき、前から 3 番目にくる値を求めてください。\u003c/p>"},{"id":"abc476_d","title":"D - Automat","url":"https://atcoder.jp/contests/abc476/tasks/abc476_d?lang=ja","summary":"\u003cp>AtCoder 王国では、 1 ドル紙幣と K ドル紙幣の 2 種類の紙幣が流通しています。 AtCoder 王国にある J 社の全自動食堂では、デザートやドリンクが商品として売られています。 問：高橋君が手持ちの紙幣で買える商品の組合せにおいて、購入できる商品数の最大値を求めてください。\u003c/p>"},{"id":"abc475_c","title":"C - Walk the Line","url":"https://atcoder.jp/contests/abc475/tasks/abc475_c?lang=ja","summary":"\u003cp>N 個の街が一直線上に並んでいます。街には 1, 2, \\ldots, N の番号が付けられており、 1 \\leq i \\leq N-1 を満たす各整数 i について、街 i と街 i + 1 は長さ A_i の道で結ばれています。 あなたははじめ、街 S にいます。あなたは、道で結ばれた 2 つの街の間を、その道を通って移動することを繰り返すことができます。 問：あなたの移動距離の合計が L 以下となるように移動するとき、一連の移動で訪れる街の数として考えられる最大値を求めてください。ただし、街 S も訪れた街に含め、複数回同じ街を訪れても 1 度しか数えないものとします。\u003c/p>"},{"id":"abc475_d","title":"D - Alphametic Prime","url":"https://atcoder.jp/contests/abc475/tasks/abc475_d?lang=ja","summary":"\u003cp>英小文字からなる文字列 S が与えられます。以下の条件を満たす素数 P が存在するなら 1 つ求めてください。\u003c/p>"},{"id":"abc474_c","title":"C - Remove and Append","url":"https://atcoder.jp/contests/abc474/tasks/abc474_c?lang=ja","summary":"\u003cp>(1,2,\\dots,N) の順列 P=(P_1,P_2,\\dots,P_N) が与えられます。 q=1,2,\\dots,Q の順に、以下の操作を行います。 問：Q 個の操作を行った後の P の各要素の値を求めてください。 条件：P から値が a_q である要素を削除し、それを P の末尾に追加する。\u003c/p>"},{"id":"abc474_d","title":"D - Outweigh","url":"https://atcoder.jp/contests/abc474/tasks/abc474_d?lang=ja","summary":"\u003cp>N 種類の石 1,2,\\dots,N があり、同じ種類の石の重みはすべて同じです。 高橋君と青木君は石 i をそれぞれ A_i,B_i 個ずつ持っています。 以下の条件を満たすような正整数列 W=(W_1,W_2,\\dots,W_N) が存在するかどうかを判定し、存在するならば一つ構成してください。 条件：1 \\leq W_i \\leq 10^{18} / 石 i の重みが W_i のとき、高橋君が持っている石の重みの総和が青木君が持っている石の重みの総和よりも真に大きい。\u003c/p>"},{"id":"abc473_c","title":"C - Change Schools","url":"https://atcoder.jp/contests/abc473/tasks/abc473_c?lang=ja","summary":"\u003cp>現在 AtCoder 高校には K 個のクラスと N 人の生徒が存在し、 i 人目 (1\\le i\\le N) の生徒は A _ i 番目のクラスに所属しています。 高橋くんは 9 月から AtCoder 高校に転入することになりました。 高橋くんは、転入する際に K 個のクラスの中から好きなクラスを 1 つ選び、そのクラスに所属することができます。 問：所属したときに高橋くんが喜ぶクラスがいくつあるか求めてください。\u003c/p>"},{"id":"abc473_d","title":"D - Coefficient Stair","url":"https://atcoder.jp/contests/abc473/tasks/abc473_d?lang=ja","summary":"\u003cp>非負整数からなる長さ N の列 A=(A _ 1,A _ 2,\\ldots,A _ N) であって、 \\displaystyle\\sum _ {i=1} ^ Ni\\times A _ i=K を満たすものを辞書順で小さいほうからすべて出力してください。 ここで、条件を満たす数列が 3\\times10 ^ 5 個以下であるような入力のみが与えられます。 条件：|S| \\lt |T| かつ (S_1,S_2,\\ldots,S_{|S|}) = (T_1,T_2,\\ldots,T_{|S|}) ．\u003c/p>"},{"id":"abc472_c","title":"C - On a Diet","url":"https://atcoder.jp/contests/abc472/tasks/abc472_c?lang=ja","summary":"\u003cp>高橋君は N 日間の帰省で実家に滞在しています。 実家では毎日おやつが用意されており、 i 日目のおやつのカロリーは A_i です。 問：i=1,2,\\dots,N それぞれについて、高橋君が i 日目のおやつを食べるかどうかを判定してください。 条件：i 日目のおやつを食べたと仮定したときに \\max(i-M+1,1) 日目から i 日目までの間に食べたおやつのカロリーの合計が K 以下ならば、 i 日目のおやつを実際に食べる。そうでないならば、 i 日目のおやつを食べない。\u003c/p>"},{"id":"abc472_d","title":"D - Bomber Mad","url":"https://atcoder.jp/contests/abc472/tasks/abc472_d?lang=ja","summary":"\u003cp>H 行 W 列のグリッドがあります。各マスは、空マスまたは爆弾マスのどちらかです。上から i 行目、左から j 列目のマスを (i,j) と表します。グリッドの情報は H 個の長さ W の文字列 S_1, S_2 , \\dots ,S_H によって与えられ、 S_i の j 文字目が . のとき (i,j) は空マス、 S_i の j 文… また、空マス (i,j) について i 行目にも j 列目にも爆弾マスが存在しないとき、そのマスを 安全な空マス と呼びます。 問：1 回の移動で今いるマスから、上下左右に隣り合う空マスに移動することができます（爆弾マスには移動できません）。以下の条件を満たす空マス (i, j) の数を求めてください。 条件：(i,j) から K 回以下の移動で 安全な空マス へ到達できる。\u003c/p>"},{"id":"abc471_c","title":"C - Cookies and Greedy Takahashi","url":"https://atcoder.jp/contests/abc471/tasks/abc471_c?lang=ja","summary":"\u003cp>数直線上の N 箇所にクッキーが落ちています。 i 番目のクッキーの落ちている座標は A_i です。 高橋君は最初、数直線の座標 0 にいて、 N 個のクッキー全てを拾うまで以下の行動を繰り返します。 問：全てのクッキーを拾うまでの高橋君の移動距離の合計を求めてください。 条件：行動：自身から最も近いクッキーのある座標(複数あるときは座標の最も小さいもの)へ移動し、そのクッキーを拾う。\u003c/p>"},{"id":"abc471_d","title":"D - Chargers","url":"https://atcoder.jp/contests/abc471/tasks/abc471_d?lang=ja","summary":"\u003cp>無尽蔵の差込口をもつ充電器があります。時刻 0 にはどの差込口も空です。 問：バッテリーの最大容量は V です。バッテリーは差込口に挿入されているあいだ、残量が最大容量に達するまで速度 1 で充電されます(つまり、 1 単位時間が経過するごとに残量が 1 増加します)。 条件：タイプ 1 ( 1\\ t_q\\ w_q ): 時刻 t_q に、残量 w_q のバッテリーを 1 つ差込口に挿入する。 / タイプ 2 ( 2\\ t_q ): 時刻 t_q に、最も残量が多いバッテリーを 1 つ差込口から排出し、そのバッテ…\u003c/p>"},{"id":"abc470_c","title":"C - Inc, Dec, Xor","url":"https://atcoder.jp/contests/abc470/tasks/abc470_c?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\ldots,A_N) があります。はじめ、 A の要素は全て 0 です。 Q 個のクエリが与えられるので、順に処理してください。クエリは 2 種類あり、以下のいずれかの形式で与えられます。 問：各クエリを処理した直後の A_1,A_2,\\ldots,A_N のビット単位 \\mathrm{XOR} を求めてください。 条件：1 x ： A_x の値を 1 増やす。 / 2 ： i=1,2,\\ldots,N に対し、 A_i \\geq 1 ならば A_i の値を 1 減らす。\u003c/p>"},{"id":"abc470_d","title":"D - Inverse and Swap","url":"https://atcoder.jp/contests/abc470/tasks/abc470_d?lang=ja","summary":"\u003cp>(1, \\dots, N) の順列 P = (P_1, \\dots, P_N) が与えられます。 Q 個のクエリを順に処理してください。クエリは以下の 2 種類です。 問：すべてのクエリを処理したあとの P_1, \\dots, P_N の値を出力してください。 条件：1 x y : P_x と P_y の値を入れ替える。 / 2 : 以下の条件を満たす (1, \\dots, N) の順列 P&#x27; = (P&#x27;_1, \\dots, P&#x27;_N) を作り、 P_1, \\dots, P_N の値をそれぞれ P&#x27;_1…\u003c/p>"},{"id":"abc469_c","title":"C - Cantrip","url":"https://atcoder.jp/contests/abc469/tasks/abc469_c?lang=ja","summary":"\u003cp>o と x からなる長さ N の文字列 S が与えられます。 N 個の袋が一列に並んでいて、各袋にはお菓子が 1 個ずつ入っています。 i 番目の袋には、 S の i 文字目が o ならば「当たり」と書かれており、 x ならば「はずれ」と書かれています。 k=1,2,\\dots,N について以下の問題を解いてください。 問：高橋君は列の先頭から k 個の袋を受け取り、入っているお菓子を食べ、袋は持っておきます。 その後、以下の行動を可能な限り繰り返します。 高橋君が持っている「当たり」と書かれた袋を 1 個捨て、列の先頭の袋を受け取り、中のお菓子を食べてその袋を持っておく。ただし、列にまだ袋が残っていて、かつ「当たり」と書かれた袋を持っている場合にしか行動はできない。 条件：高橋君が持っている「当たり」と書かれた袋を 1 個捨て、列の先頭の袋を受け取り、中のお菓子を食べてその袋を持っておく。ただし、列にまだ袋が残っていて、かつ「当たり」と書かれた袋を持っている場合にしか行動はできない。\u003c/p>"},{"id":"abc469_d","title":"D - The Big Two","url":"https://atcoder.jp/contests/abc469/tasks/abc469_d?lang=ja","summary":"\u003cp>あるゲームには N 人のプレイヤー 1,2,\\dots,N がいます。 このゲームは 2 人のプレイヤーが 1 対 1 で戦う形式です。 N 人のプレイヤーによるトーナメント戦が M 回行われ、 m 回目のトーナメント戦の決勝にはプレイヤー A_m,B_m の 2 人が勝ち上がりました。 条件：1 \\leq x \\lt y \\leq N / どのトーナメント戦においても、プレイヤー x とプレイヤー y の少なくとも一方が決勝に勝ち上がっている\u003c/p>"},{"id":"abc468_c","title":"C - Between P and Q","url":"https://atcoder.jp/contests/abc468/tasks/abc468_c?lang=ja","summary":"\u003cp>整数 N と (1,2,\\ldots,N) を並び替えた整数列 P=(P_1,P_2,\\ldots, P_N),Q=(Q_1,Q_2,\\ldots,Q_N) が与えられます。 問：(1,2,\\ldots,N) を並び替えた整数列であって辞書順で P より大きく Q より小さいものがいくつあるか求めてください。 条件：|S| \\lt |T| かつ (S_1,S_2,\\ldots,S_{|S|}) = (T_1,T_2,\\ldots,T_{|S|}) 。\u003c/p>"},{"id":"abc468_d","title":"D - Pre-Palindrome","url":"https://atcoder.jp/contests/abc468/tasks/abc468_d?lang=ja","summary":"\u003cp>以下の条件を満たす英小文字からなる文字列を 良い文字列 とします。 例えば a 、 iwai 、 abcdcza などは良い文字列ですが、 abcd 、 atcoder などは良い文字列ではありません。特に、回文も良い文字列であることに注意してください。 問：2 つの部分文字列は、 S から取り出す場所が異なれば文字列として等しくても区別して数えることに注意してください。 条件：1 文字以下を書き換えることで回文にすることができる。\u003c/p>"},{"id":"abc467_c","title":"C - Adjacent Sums (easy)","url":"https://atcoder.jp/contests/abc467/tasks/abc467_c?lang=ja","summary":"\u003cp>※ C 問題の問題文は E 問題と同じです。赤字で示された制約のみが異なります。 0 以上 M-1 以下の整数からなる整数列 A=(A_1,A_2,\\dots,A_N),B=(B_1,B_2,\\dots,B_{N-1}) が与えられます。 A,B の長さはそれぞれ N,N-1 です。 問：以下の条件を満たすようにするために必要な操作回数の最小値を求めてください。 なお、問題の制約下では、必ず条件を満たすようにできることが証明できます。 条件：1 以上 N 以下の整数 i を 1 つ選び、 A_i に 1 を加える。 / i=1,2,\\dots,N-1 について、 A_i+A_{i+1} を M で割った余りは B_i に等しい。\u003c/p>"},{"id":"abc467_d","title":"D - Concentric Circles","url":"https://atcoder.jp/contests/abc467/tasks/abc467_d?lang=ja","summary":"\u003cp>xy 平面上に以下の条件を全て満たす 2 個の円 C_1, C_2 は存在しますか？ ただし C_1, C_2 は同一である可能性があります。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：異なる 2 点 (P_x, P_y), (Q_x, Q_y) は C_1 の円周上にある。 / 異なる 2 点 (R_x, R_y), (S_x, S_y) は C_2 の円周上にある。\u003c/p>"},{"id":"abc466_c","title":"C - Count Close Pairs","url":"https://atcoder.jp/contests/abc466/tasks/abc466_c?lang=ja","summary":"\u003cp>この問題は インタラクティブな問題 （あなたが作成したプログラムとジャッジプログラムが標準入出力を介して対話を行う形式の問題）です。 数直線上に、点 1 , 2 , \\ldots , N が この順に 左から右に並んでいます。 問：距離が 1 以下の 2 点組の個数、すなわち 1\\leq i&lt;j\\leq N をみたす整数の組 (i,j) であって、点 i と点 j の距離が 1 以下であるようなものの個数を出力してください。 条件：1 \\leq i &lt; j \\leq N を満たす整数 i,j を選び、点 i と点 j の距離が 1 以下であるか質問する。\u003c/p>"},{"id":"abc466_d","title":"D - Placing Rooks","url":"https://atcoder.jp/contests/abc466/tasks/abc466_d?lang=ja","summary":"\u003cp>N 行 N 列のマス目があります。 最初、マス目の上には何も置かれていません。 その状態から始めて、高橋君がマス目に対して M 回の操作を順に行います。 i 回目 (1\\leq i\\leq M) の操作は以下のとおりです。 問：M 回の操作の後でマス目に置かれているコマの個数を出力してください。 条件：上から R_i 行目のマスに置かれているコマをすべて取り除く。 / 次に、左から C_i 列目のマスに置かれているコマをすべて取り除く。\u003c/p>"},{"id":"abc465_c","title":"C - Reverse Permutation","url":"https://atcoder.jp/contests/abc465/tasks/abc465_c?lang=ja","summary":"\u003cp>整数 N と o と x からなる長さ N の文字列 S が与えられます。 長さ N の整数列 A=(A_1,A_2,\\ldots,A_N) があります。はじめ A=(1,2,\\ldots,N) です。 問：全ての操作を終えた後の A を求めてください。 条件：S_k= o である場合、 A の先頭 k 項を反転する。具体的には、 A を (A_k,A_{k-1},\\ldots,A_1,A_{k+1},A_{k+2},\\ldots,A_N) に置き換える。 / S_k= x である場合は何もしない。\u003c/p>"},{"id":"abc465_d","title":"D - X to Y","url":"https://atcoder.jp/contests/abc465/tasks/abc465_d?lang=ja","summary":"\u003cp>整数 X,Y と 2 以上の整数 K が与えられます。 変数 x があり、はじめ x=X です。あなたは x に対して以下の操作を 0 回以上何回でも行うことができます： 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：\\displaystyle \\left\\lfloor \\frac xK \\right\\rfloor=y または \\displaystyle \\left\\lfloor \\frac yK \\right\\rfloor=x を満たす整数 y を選び…\u003c/p>"},{"id":"abc464_c","title":"C - Plumage Palette","url":"https://atcoder.jp/contests/abc464/tasks/abc464_c?lang=ja","summary":"\u003cp>高橋君は鳥 1,2,\\dots,N の N 羽の鳥を M 日間観察しました。 高橋君が観察した鳥には色 1,2,\\dots,N の N 色のうちいずれか 1 色がついていますが、これらの鳥には観察期間中に色が変化するという興味深い特徴があります。 鳥 i は D_i-1 日目以前の観察では色 A_i であり、 D_i 日目以降の観察では色 B_i になりました。 ただし、 D_i=1 である場合はその鳥の色は 1 日目の観察から B_i であり、 A_i=B_i である場合… 問：j=1,2,\\dots,M について、 j 日目の観察で鳥の色が何種類あったかを求めてください。\u003c/p>"},{"id":"abc464_d","title":"D - Celester","url":"https://atcoder.jp/contests/abc464/tasks/abc464_d?lang=ja","summary":"\u003cp>これから N 日間の天気が文字列 S として与えられます。 S の i 文字目が S であるとき i 日目の天気は晴れ、 R であるとき i 日目の天気は雨です。 また、現時点では嬉しさは 0 です。 あなたは、以下の操作を 0 回以上何回でも行えます。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：1 以上 N 以下の整数 i を選ぶ。 / i 日目の天気が晴れであれば雨、雨であれば晴れに変更する。\u003c/p>"},{"id":"abc463_c","title":"C - Tallest at the Moment","url":"https://atcoder.jp/contests/abc463/tasks/abc463_c?lang=ja","summary":"\u003cp>現在、会議室に N 人の高橋くんがいます。 i 番目 (1\\le i\\le N) の高橋くんの身長は H _ i であり、今から L _ i 分後に会議室を去ります。 一度会議室を去った高橋くんはそれ以降会議室に戻ることはありません。 問：Q 個のクエリが与えられるので、順に答えてください。 i 番目 (1\\le i\\le Q) のクエリでは整数 T _ i が与えられるので、今から T _ i+\\dfrac12 分後に会議室にいる高橋くんの身長の最大値を答えてください。 この問題の制約のもとで、今から T _ i+\\dfrac12 分後には会議室に 1 人以上の高橋くんがいることが保証されます。\u003c/p>"},{"id":"abc463_d","title":"D - Maximize the Gap","url":"https://atcoder.jp/contests/abc463/tasks/abc463_d?lang=ja","summary":"\u003cp>数直線上に N 枚の布があります。 i 枚目 (1\\le i\\le N) の布は数直線上の区間 \\lbrack L _ i,R _ i\\rbrack を覆っています。 数直線上の点は 2 枚以上の布で覆われていることも、どの布にも覆われていないこともあります。 2 枚の布が重なっているとは、数直線上のある点がその 2 枚の布どちらにも覆われていることをいいます。 問：ただし、そのように K 枚の布を選ぶことができない場合、 -1 を出力してください。 条件：一方の布に覆われている点 p ともう一方の布に覆われている点 q に対する |p-q| の最小値\u003c/p>"},{"id":"abc462_c","title":"C - Not Covered Points","url":"https://atcoder.jp/contests/abc462/tasks/abc462_c?lang=ja","summary":"\u003cp>2 次元平面上に点 1 から点 N までの N 個の点があります。点 i (1\\le i\\le N) の座標は (X_i,Y_i) です。ここで、 X,Y はそれぞれ (1,2,\\ldots,N) の順列であることが保証されます。 問：左下の頂点を (0,0) 、右上の頂点を (X_i,Y_i) とする x 軸に平行な辺と y 軸に平行な辺のみからなる長方形の内部（辺上を含まない）に点 1 から点 N までの N 個の点をどれも含まないような i の個数を求めてください。\u003c/p>"},{"id":"abc462_d","title":"D - Accomplice","url":"https://atcoder.jp/contests/abc462/tasks/abc462_d?lang=ja","summary":"\u003cp>とある館で殺人事件が起きました。犯人の候補は N 人おり、彼らを人 1 、人 2 、 \\dots 、人 N と呼びます。 人 i は時刻 S_i に館に入り、時刻 T_i に館を出て、ほかの時刻には出入りしませんでした。 問：N 人の犯人候補の中に犯人が 2 人ともいると仮定したとき、 2 人の犯人と犯行開始時刻の組としてありうるものは何通りあるでしょうか。ここで、 2 人の犯人には順番を付けません。 条件：犯人はちょうど 2 人いる。 / 犯行はある整数時刻 x に開始し、 D 単位時間かけて行われ、時刻 x + D に完了した。\u003c/p>"},{"id":"abc461_c","title":"C - Variety","url":"https://atcoder.jp/contests/abc461/tasks/abc461_c?lang=ja","summary":"\u003cp>N 個の宝石があります。 i 番目の宝石の色（整数で表されます）は C_i で価値は V_i です。 この N 個の宝石の中から K 個を選びます。ただし、選んだ宝石の色が M 種類以上なければなりません。 問：このとき、選んだ宝石の価値の総和としてありうる最大値を求めてください。（与えられる入力では、このような選択が必ず可能です。）\u003c/p>"},{"id":"abc461_d","title":"D - Count Subgrid Sum = K","url":"https://atcoder.jp/contests/abc461/tasks/abc461_d?lang=ja","summary":"\u003cp>H \\times W のグリッドがあり、各マスには 0 または 1 の整数が書き込まれています。 各マスに書き込まれた整数の情報は H 個の長さ W の文字列 S_1,S_2,\\dots,S_H として与えられます。 問：書き込まれた整数の総和が K となる長方形領域がいくつあるか求めてください。 厳密には、以下の条件を全て満たす整数の四つ組 (r_1,c_1,r_2,c_2) がいくつあるか求めてください。 条件：1 \\le r_1 \\le r_2 \\le H / 1 \\le c_1 \\le c_2 \\le W\u003c/p>"},{"id":"abc460_c","title":"C - Sushi","url":"https://atcoder.jp/contests/abc460/tasks/abc460_c?lang=ja","summary":"\u003cp>寿司の材料として、 N 個のシャリと M 個のネタがあります。 i 番目のシャリの重さは A_i 、 j 番目のネタの重さは B_j です。 問：作ることのできる寿司の個数の最大値を求めてください。\u003c/p>"},{"id":"abc460_d","title":"D - Repeatedly Repainting","url":"https://atcoder.jp/contests/abc460/tasks/abc460_d?lang=ja","summary":"\u003cp>H 行 W 列のマス目があります。このマス目の上から i 行目、左から j 列目のマスをマス (i, j) と呼びます。 すべてのマスは白または黒で塗られています。マス目の情報は H 個の長さ W の文字列 S_1, S_2, \\ldots, S_H によって与えられ、 S_i の j 文字目が . のときマス (i, j) は白で、 S_i の j… 問：操作を終えた後に各マスが何色で塗られているか求めてください。 条件：すべてのマスに対して同時に以下の規則で色の塗り替えを行う。 操作前に白く塗られているマスは、そのマスに隣接する黒く塗られているマスが存在するとき、またそのときに限り黒く塗り替える。\u003c/p>"},{"id":"abc459_c","title":"C - Drop Blocks","url":"https://atcoder.jp/contests/abc459/tasks/abc459_c?lang=ja","summary":"\u003cp>N 個のマスが左右一列に並んでいます。 はじめ、すべてのマスには何も置かれていません。 問：Q 個のクエリが与えられるので、順に処理してください。 各クエリは次の 2 種類のいずれかです。 条件：1 x : 左から x 番目のマスにブロックを 1 個積む。その後、すべてのマスに 1 個以上のブロックが積まれているならば、すべてのマスからブロックを 1 個ずつ取り除く。\u003c/p>"},{"id":"abc459_d","title":"D - Adjacent Distinct String","url":"https://atcoder.jp/contests/abc459/tasks/abc459_d?lang=ja","summary":"\u003cp>英小文字からなる文字列 S が与えられます。 S の各文字を並び替えることでどの隣り合う 2 文字も異なるようにすることが可能か判定し、可能な場合はそのような並び替えを一つ求めてください。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。\u003c/p>"},{"id":"abc458_c","title":"C - C Stands for Center","url":"https://atcoder.jp/contests/abc458/tasks/abc458_c?lang=ja","summary":"\u003cp>英大文字からなる文字列 S が与えられます。 以下の条件を全て満たす S の部分文字列 (連続する部分列) がいくつあるか求めてください。 問：ただし、部分文字列が文字列として一致していても、抜き出した文字の位置が異なる場合、それぞれ別に数えます。 条件：奇数個の文字からなる。 / 中央の文字が C である。厳密には、抜き出した部分文字列が l 文字からなるとき、その (l+1)/2 文字目が C である。\u003c/p>"},{"id":"abc458_d","title":"D - Chalkboard Median","url":"https://atcoder.jp/contests/abc458/tasks/abc458_d?lang=ja","summary":"\u003cp>黒板に整数 X が 1 つ書かれています。 Q 個のクエリが与えられるので、順に処理してください。 i 個目 (1\\le i\\le Q) のクエリは以下の通りです。 問：その後、黒板に書かれた 2i+1 個の整数の中央値を出力する。\u003c/p>"},{"id":"abc457_c","title":"C - Long Sequence","url":"https://atcoder.jp/contests/abc457/tasks/abc457_c?lang=ja","summary":"\u003cp>整数 N,K と N 個の整数列 A_1,A_2,\\ldots,A_N 、長さ N の整数列 C=(C_1,C_2,\\ldots,C_N) が与えられます。整数列 A_i の長さは L_i であり A_i=(A_{i,1},A_{i,2},\\ldots,A_{i,L_i}) です。 A と C から以下の手順で整数列 B=(B_1,B_2,\\ldots,B_{\\sum_{i=1}^N C_iL_i}) を構成します。 問：B_K の値を求めてください。 条件：B を長さ 0 の整数列とする。 / i=1,2,\\ldots,N の順に以下の操作を行う： B の末尾に A_i を連結させる操作を C_i 回行う。\u003c/p>"},{"id":"abc457_d","title":"D - Raise Minimum","url":"https://atcoder.jp/contests/abc457/tasks/abc457_d?lang=ja","summary":"\u003cp>長さ N の数列 A = (A_1, A_2, \\ldots, A_N) と整数 K が与えられます。 あなたは次の操作を 0 回以上 K 回以下行うことができます。 問：操作後の数列に対する \\displaystyle \\min_{1 \\le i \\le N} A_i としてありうる最大値を求めてください。 条件：1 \\le i \\le N を満たす整数 i を 1 つ選び、 A_i に i を加える。\u003c/p>"},{"id":"abc456_c","title":"C - Not Adjacent","url":"https://atcoder.jp/contests/abc456/tasks/abc456_c?lang=ja","summary":"\u003cp>a , b , c からなる文字列 S が与えられます。 問：S の空でない 部分文字列 であって、同じ文字が隣り合わないものの個数を 998244353 で割った余りを求めてください。\u003c/p>"},{"id":"abc456_d","title":"D - Not Adjacent 2","url":"https://atcoder.jp/contests/abc456/tasks/abc456_d?lang=ja","summary":"\u003cp>a , b , c からなる文字列 S が与えられます。 問：S の空でない 部分列 であって、同じ文字が隣り合わないものの個数を 998244353 で割った余りを求めてください。\u003c/p>"},{"id":"abc455_c","title":"C - Vanish","url":"https://atcoder.jp/contests/abc455/tasks/abc455_c?lang=ja","summary":"\u003cp>整数列 A = (A_1, A_2, \\ldots, A_N) が与えられます。 問：以下の操作をちょうど K 回行った後の A の各要素の和として考えられる最小値を求めてください。 条件：整数 x を選ぶ。 A_i = x なる各 i について A_i の値を 0 に置き換える。\u003c/p>"},{"id":"abc455_d","title":"D - Card Pile Query","url":"https://atcoder.jp/contests/abc455/tasks/abc455_d?lang=ja","summary":"\u003cp>カードが N 枚とカードの山が N 個あります。 カードとカードの山にはそれぞれ 1, 2, \\ldots, N の番号が付けられており、はじめ、山 i にはカード i のみが積まれています。 問：すべての操作を終えた後、各山に積まれているカードの枚数を求めてください。 条件：カード C_i およびカード C_i の上に積まれているカードを順序を保ってカード P_i の上に移動させる。ただし、操作を行う直前の時点でカード C_i とカード P_i は異なる山にあり、カード P_i はある山の一番上に積まれているこ…\u003c/p>"},{"id":"abc454_c","title":"C - Straw Millionaire","url":"https://atcoder.jp/contests/abc454/tasks/abc454_c?lang=ja","summary":"\u003cp>アイテム 1 からアイテム N までの N 種類のアイテムがあります。はじめ、高橋君はアイテム 1 のみ持っています。 高橋君には M 人の友達がいます。 i 人目 (1\\le i\\le M) の友達にアイテム A_i を渡すと、アイテム B_i をもらうことができます。 問：高橋君が手に入れることのできるアイテムはアイテム 1 を含めて何種類あるか求めてください。\u003c/p>"},{"id":"abc454_d","title":"D - (xx)","url":"https://atcoder.jp/contests/abc454/tasks/abc454_d?lang=ja","summary":"\u003cp>( , x , ) からなる文字列 A が与えられます。 あなたは A に対して次の 2 種類の操作を自由な順番で自由な回数行うことが出来ます。 ( , x , ) からなる文字列 B が与えられます。 A を B と一致させることが出来るか判定してください。 問：T 個のテストケースが与えられるので、それぞれに対して答えを求めてください。 条件：A の部分文字列 (xx) を 1 カ所選び、 xx に置換する。 / A の部分文字列 xx を 1 カ所選び、 (xx) に置換する。\u003c/p>"},{"id":"abc453_c","title":"C - Sneaking Glances","url":"https://atcoder.jp/contests/abc453/tasks/abc453_c?lang=ja","summary":"\u003cp>数直線上の座標 0.5 に高橋君がいます。 高橋君はこれから N 回の移動を行います。 i 回目の移動では、「正の方向」「負の方向」のいずれかを選び、その方向に L_i 進みます。 問：高橋君は座標 0 を最大で何回通り過ぎることが出来るでしょうか？ なお、この問題の制約上、座標 0 で完了する移動が生じることはありません。\u003c/p>"},{"id":"abc453_d","title":"D - Go Straight","url":"https://atcoder.jp/contests/abc453/tasks/abc453_d?lang=ja","summary":"\u003cp>縦 H マス \\times 横 W マスのマス目があり、高橋君はこのマス目を上下左右に移動します。 上から i 番目かつ左から j 番目 (1\\leq i\\leq H, 1\\leq j\\leq W) のマスの状態は文字 S_{i,j} で表されます。 S_{i,j} は # , . , o , x , S , G のいずれかです。 なお、 S_{i,j}= S , G であるような (i,j) は 1\\leq i\\leq H, 1\\leq j\\leq W の範囲にちょうど 1 つずつ存在します。 問：高橋君は最初にいる地点から、上下左右に隣接するマスへの移動を繰り返して、目的地へと到達したいです。 そのような事が可能か判定し、可能ならば条件をみたす移動方法であって、隣接するマスへの移動回数が 5\\times 10^6 以下であるようなものを一つ出力してください。 条件：S_{i,j}= # のとき：このマスに立ち入ることはできない。 / S_{i,j}= . のとき：このマスに自由に出入りすることができる。すなわち、このマスに立ち入った後、上下左右に隣接する好きなマスに（存在するならば）移動できる。\u003c/p>"},{"id":"abc452_c","title":"C - Fishbones","url":"https://atcoder.jp/contests/abc452/tasks/abc452_c?lang=ja","summary":"\u003cp>アーティストの高砂君は、魚の骨をかたどったオブジェを作りました。 オブジェは N 本の肋骨と 1 本の脊椎からなります。 肋骨には 1 から N までの番号が付けられています。 問：j = 1, \\cdots, M に対して、以下の質問に答えてください。 条件：脊椎に書く文字列の長さは N である。 / 肋骨 i = 1, \\dots, N に対して、以下が成り立つ。 肋骨 i に書く文字列の長さは A_i である。\u003c/p>"},{"id":"abc452_d","title":"D - No-Subsequence Substring","url":"https://atcoder.jp/contests/abc452/tasks/abc452_d?lang=ja","summary":"\u003cp>英小文字からなる文字列 S,T が与えられます。 問：S の空でない部分文字列 s のうち、 T を（連続するとは限らない）部分列として 含まない ものの個数を求めてください。\u003c/p>"},{"id":"abc451_c","title":"C - Understory","url":"https://atcoder.jp/contests/abc451/tasks/abc451_c?lang=ja","summary":"\u003cp>高橋くんは、庭にある木の本数を管理しています。はじめ、庭に木は 1 本もありません。 問：Q 個のクエリが順に与えられます。クエリは次の 2 種類のいずれかです。各クエリを処理した直後に庭にある木の本数を出力してください。 条件：1 h : 庭に高さ h の木を新たに 1 本追加する。 / 2 h : いま庭にある木のうち、高さが h 以下の木をすべて削除する。\u003c/p>"},{"id":"abc451_d","title":"D - Concat Power of 2","url":"https://atcoder.jp/contests/abc451/tasks/abc451_d?lang=ja","summary":"\u003cp>以下の条件を満たす正整数を 良い整数 とします。 問：良い整数のうち N 番目に小さいものを求めてください。 ただし N 番目に小さい良い整数は 10^9 以下であることが保証されます。 条件：条件：一つ以上の 2 の冪（ 1,2,4,8,16,\\dots ）を（重複と並び替えを許して）選んで文字列として結合し、それを整数として解釈することで得られる。\u003c/p>"},{"id":"abc450_c","title":"C - Puddles","url":"https://atcoder.jp/contests/abc450/tasks/abc450_c?lang=ja","summary":"\u003cp>縦 H 行、横 W 列のグリッドがあります。 上から i 行目左から j 列目のマスは S_{i,j} が # のとき黒く、 . のとき白く塗られています。 白マスからなる四方位に連結な領域のうち、黒マスに囲まれたものの個数を求めてください。 問：上から i 行目左から j 列目のマスをマス (i,j) と表します。 2 つのマス (i,j),(i&#x27;,j&#x27;) が隣接しているとは、 |i-i&#x27;|+|j-j&#x27;|=1 であることと定めます。 白マスの集合 C が連結であるとは、 C に属するどの 2 マス c,c&#x27; に対しても、 C に属する隣接するマスへの移動を繰り返すことで c から c&#x27; へ移動できることと定めます。\u003c/p>"},{"id":"abc450_d","title":"D - Minimize Range","url":"https://atcoder.jp/contests/abc450/tasks/abc450_d?lang=ja","summary":"\u003cp>長さ N の正整数列 A と正整数 K が与えられます。 数列 A に対して、以下の操作を何回でも行うことができます。 問：\\max(A)-\\min(A) としてあり得る値の最小値を求めてください。 条件：1 以上 N 以下の整数 i を一つ選び、 A_i に K を足す。\u003c/p>"},{"id":"abc449_c","title":"C - Comfortable Distance","url":"https://atcoder.jp/contests/abc449/tasks/abc449_c?lang=ja","summary":"\u003cp>英小文字からなる長さ N の文字列 S が与えられます。 問：整数の組 (i, j) であって、以下の条件をすべて満たすものの個数を求めてください。 条件：1 \\leq i \\leq j \\leq N / S_i = S_j\u003c/p>"},{"id":"abc449_d","title":"D - Make Target 2","url":"https://atcoder.jp/contests/abc449/tasks/abc449_d?lang=ja","summary":"\u003cp>2 次元座標平面があり、座標が (x, y) である格子点は \\max(|x|, |y|) が偶数のとき黒、奇数のとき白で塗られています。 問：L \\leq x \\leq R かつ D \\leq y \\leq U を満たす整数の組 (x, y) のうち、座標 (x, y) が黒く塗られているものの個数を求めてください。\u003c/p>"},{"id":"abc448_c","title":"C - Except and Min","url":"https://atcoder.jp/contests/abc448/tasks/abc448_c?lang=ja","summary":"\u003cp>1 から N の番号がついた N 個のボールが袋に入っています。ボール i には整数 A_i が書かれています。 Q 個のクエリを処理してください。 クエリでは長さ K の数列 B_1, B_2, \\dots, B_{K} が与えられるので以下の一連の操作を行ってください。ここで、 B_i は全て 1 以上 N 以下で、かつ相異なります。 条件：まず、ボール B_1 , ボール B_2 , \\dots , ボール B_K を全て袋から取り出す。 / そして、現在の袋に入っているボールに書かれた整数の最小値を出力する。(この時、袋は空でないことが制約から保証されている。)\u003c/p>"},{"id":"abc448_d","title":"D - Integer-duplicated Path","url":"https://atcoder.jp/contests/abc448/tasks/abc448_d?lang=ja","summary":"\u003cp>頂点 1,2,\\dots,N の N 頂点からなる木が与えられます。この木の辺のうち i 本目は頂点 U_i と頂点 V_i を結びます。 頂点 i には整数 A_i が書かれています。 問：全ての k=1,2,\\dots,N について以下の問題に答えてください。 条件：問題: 頂点 1 から頂点 k への単純なパス (同じ頂点を複数回通らないパス) に含まれる頂点について、同じ整数の書かれた異なる 2 頂点の組が存在すれば Yes 、そうでないなら No と答えよ。\u003c/p>"},{"id":"abc447_c","title":"C - Insert and Erase A","url":"https://atcoder.jp/contests/abc447/tasks/abc447_c?lang=ja","summary":"\u003cp>英大文字からなる文字列 S,T が与えられます。 あなたは以下の 2 種類の操作を好きな順序で好きな回数（ 0 回でも良い）行うことができます。 問：S を T に一致させることが可能かどうか判定し、可能な場合は必要な操作回数の合計の最小値を求めてください。 条件：S の好きな位置（先頭および末尾を含む）に文字 A を 1 つ挿入する。 / S に含まれる文字 A を 1 つ選んで削除する。なお、残った文字は元の順序を保ったまま連結される。\u003c/p>"},{"id":"abc447_d","title":"D - Take ABC 2","url":"https://atcoder.jp/contests/abc447/tasks/abc447_d?lang=ja","summary":"\u003cp>A , B , C の 3 種類の文字のみからなる文字列 S が与えられます。 操作を以下のように定義します。 問：文字列 S に対して最大で何回操作を行うことができるかを求めてください。\u003c/p>"},{"id":"abc446_c","title":"C - Omelette Restaurant","url":"https://atcoder.jp/contests/abc446/tasks/abc446_c?lang=ja","summary":"\u003cp>AtCoder レストランは開店してから N 日間営業しました。 開店してから i 日目 (1\\leq i\\leq N) には次の行動が行われました。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：i 日目の朝に、 A_i 個の卵を仕入れる。 / i 日目の昼に、 B_i 個の卵を使用する。このとき、卵は 在庫にある卵の中で仕入れた順に使用される 。\u003c/p>"},{"id":"abc446_d","title":"D - Max Straight","url":"https://atcoder.jp/contests/abc446/tasks/abc446_d?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\ldots,A_N) が与えられます。 問：整数列 A の部分列 B=(B_1,B_2,\\ldots,B_{|B|}) であって、以下の条件を満たすものの長さの最大値を求めてください。 条件：全ての 1\\le i\\le |B| - 1 を満たす整数 i に対し、 B_i+1=B_{i+1} が成り立つ。\u003c/p>"},{"id":"abc445_c","title":"C - Sugoroku Destination","url":"https://atcoder.jp/contests/abc445/tasks/abc445_c?lang=ja","summary":"\u003cp>マス 1, マス 2,\\ldots, マス N の N 個のマスが 1 列に並んでいます。 マス i には整数 A _ i (i\\le A_ i\\le N) が書かれています。 問：s=1,2,\\ldots,N のそれぞれについて、以下の問題を解いてください。 条件：はじめ、マス s に駒を置く。「駒が置かれているマスに書かれている整数を x として、駒をマス x に移動させる」という操作を 10 ^ {100} 回行った後、駒が置かれているマスの番号を出力する。\u003c/p>"},{"id":"abc445_d","title":"D - Reconstruct Chocolate","url":"https://atcoder.jp/contests/abc445/tasks/abc445_d?lang=ja","summary":"\u003cp>N 個の板チョコのピースが机の上に置かれています。 i\\ (1 \\leq i \\leq N) 番目のピースは縦 h_i ブロック、横 w_i ブロックの長方形状です。 これらのピースは以下の方法で得られたことがわかっています。 問：以下の条件を満たすように N 個のピースを縦 H ブロック、横 W ブロックの長方形状に並べる方法を一つ求めてください。 条件：はじめに縦 H ブロック、横 W ブロックの板チョコを手に持つ。机には何も置かれていない。 / 以下の操作を N-1 回繰り返す。 現在手に持っているピースを 2 つに分割する。\u003c/p>"},{"id":"abc444_c","title":"C - AtCoder Riko","url":"https://atcoder.jp/contests/abc444/tasks/abc444_c?lang=ja","summary":"\u003cp>長さ N の正整数列 A=(A_1,A_2,\\dots,A_N) が与えられます。 AtCoder 社は棒状のスナック菓子「AtCoderりこ」を発売しました。 カップの中に長さ L の AtCoderりこが何本か入っています。 問：以下のようなことが起こりうる正整数 L をすべて求めてください。 条件：長さが L である 1 本の AtCoderりことしてそのまま残った。 / 長さの和が L であるような 2 本の AtCoderりこに分かれた。ただし、各 AtCoderりこの長さは正整数である。\u003c/p>"},{"id":"abc444_d","title":"D - Many Repunit Sum","url":"https://atcoder.jp/contests/abc444/tasks/abc444_d?lang=ja","summary":"\u003cp>i=1,2,\\dots,N に対して、 1 を A_i 個つなげた整数を B_i と表します。 より厳密には、 B_i=\\sum_{j=0}^{A_i-1}{10^j} と表します。 \\sum_{i=1}^{N}{B_i} を求めてください。\u003c/p>"},{"id":"abc443_c","title":"C - Chokutter Addiction","url":"https://atcoder.jp/contests/abc443/tasks/abc443_c?lang=ja","summary":"\u003cp>AtCoder 社は時刻 0 に始業し時刻 T に終業します。 時刻 t と時刻 t+1 との間隔は 1 秒です。 高橋君は AtCoder 社の業務時間中に SNS の chokutter を以下の規則で見ます。 問：始業から終業までに N 回青木君が高橋君のデスクの後ろを通りかかっており、そのうち i 回目は時刻 A_i でした。 始業から終業までに、高橋君は合計で何秒 chokutter を見ていましたか？ なお、 高橋君が chokutter を開いた瞬間に青木君がデスクの後ろを通りかかることはありませんでした。 条件：始業と同時に chokutter を開く。 / 青木君が高橋君のデスクの後ろを通りかかった瞬間に chokutter を開いていた場合、直ちに chokutter を閉じる。\u003c/p>"},{"id":"abc443_d","title":"D - Pawn Line","url":"https://atcoder.jp/contests/abc443/tasks/abc443_d?lang=ja","summary":"\u003cp>N \\times N のマス目があり、各列に 1 つずつ駒が置かれています。 i 列目の駒は上から R_i 行目に置かれています。 あなたは以下の操作を 0 回以上何度でも行うことができます。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：一番上の行以外に存在する駒をひとつ選び、その駒を 上に隣接するマス に移動させる。 / i 列目の駒が上から x 行目、 i+1 列目の駒が上から y 行目に存在するとする。このとき、 |x-y| \\le 1 を満たす。\u003c/p>"},{"id":"abc442_c","title":"C - Peer Review","url":"https://atcoder.jp/contests/abc442/tasks/abc442_c?lang=ja","summary":"\u003cp>N 人の研究者がおり、研究者には 1, 2, \\ldots, N の番号が付けられています。 研究者の間には M 個の利害関係があり、 i = 1, 2, \\ldots, M に対して研究者 A_i と研究者 B_i は互いに利害関係にあります。 問：ただし、すべての論文は単著であるものとします。 条件：研究者 i が著者である論文の査読者の 3 人組として考えられるものは何通りあるか求めよ。\u003c/p>"},{"id":"abc442_d","title":"D - Swap and Range Sum","url":"https://atcoder.jp/contests/abc442/tasks/abc442_d?lang=ja","summary":"\u003cp>長さ N の数列 A=(A_1,A_2,\\dots,A_N) が与えられます。 問：Q 個のクエリが与えられるので、順に処理してください。 各クエリは以下のいずれかの形式です。 条件：1 x : A_x と A_{x+1} の値を入れ替える。 / 2 l r : \\displaystyle \\sum_{l\\leq i\\leq r} A_i の値を求める。\u003c/p>"},{"id":"abc441_c","title":"C - Sake or Water","url":"https://atcoder.jp/contests/abc441/tasks/abc441_c?lang=ja","summary":"\u003cp>N 個のカップがあり、それぞれのカップには無色透明な液体が入っています。 具体的には、 i 番目 (1\\leq i\\leq N) のカップには A_i ml の液体が入っています。 また、これらのうちちょうど K 個のカップには日本酒が入っており、それ以外には水が入っていることが分かっています。 問：高橋君は（ 1 つ以上の）いくつかのカップを選んでそれらに入った液体をすべて飲むことができます。 どのカップに日本酒が入っているかによらず、高橋君が確実に X ml 以上の日本酒を飲むためには、最低何個のカップを選ぶ必要があるか求めてください。 そのような選び方が不可能である場合には -1 を出力してください。\u003c/p>"},{"id":"abc441_d","title":"D - Paid Walk","url":"https://atcoder.jp/contests/abc441/tasks/abc441_d?lang=ja","summary":"\u003cp>N 頂点 M 辺の（単純とは限らない）有向グラフがあり、頂点は頂点 1, 2, \\ldots, N と番号付けられています。 i 番目 (1\\leq i\\leq M) の辺は頂点 U_i から頂点 V_i へ向かう辺で、コストは C_i です。 また、各頂点の出次数は 4 以下です。 問：次の条件をみたす頂点 v (1\\leq v\\leq N) をすべて求めてください。 条件：ちょうど L 回辺を通る。このとき、同じ辺を複数回通っても良いが、通るたびに回数にカウントされる。 / 通った辺のコストの総和が S 以上 T 以下である。（同じ辺を複数回通った場合、通るたびに総和に加算されるものとする。）\u003c/p>"},{"id":"abc440_c","title":"C - Striped Horse","url":"https://atcoder.jp/contests/abc440/tasks/abc440_c?lang=ja","summary":"\u003cp>りんごさんは馬を縞模様に塗ってシマウマにしようとしています。 1 から N の番号がついた N 個のマスが一列に並んでいます。 最初、全てのマスは白色であり、マス i を黒く塗るためにはコストが C_i かかります。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：正整数 x を自由に選ぶ。 / 1 \\leq i \\leq N を満たす整数 i のうち、 (i+x) を 2W で割った余りが W より小さくなるもの全てに対し、マス i を黒く塗る。\u003c/p>"},{"id":"abc440_d","title":"D - Forbidden List 2","url":"https://atcoder.jp/contests/abc440/tasks/abc440_d?lang=ja","summary":"\u003cp>相異なる N 個の整数からなるリストがあります。リストの i 個目 ( 1 \\leq i \\leq N ) の整数は A_i です。 問：Q 個の質問が与えられるので、それぞれの答えを求めてください。 j 個目の質問 ( 1 \\leq j \\leq Q ) は以下の通りです。 条件：X_j 以上の整数であってリストに含まれないもののうち、小さいほうから Y_j 番目の値を求めよ。\u003c/p>"},{"id":"abc439_c","title":"C - 2026","url":"https://atcoder.jp/contests/abc439/tasks/abc439_c?lang=ja","summary":"\u003cp>正整数 n が次の条件を満たす時、 n を 良い整数 と呼びます。 例えば n=2026 とすると、 0 \\lt x \\lt y かつ x^2+y^2=n を満たす整数の組は (x,y)=(1,45) しか存在しないことが確認できます。よって 2026 は良い整数です。 問：正整数 N が与えられます。 N 以下の良い整数を全て列挙してください。 条件：0 \\lt x \\lt y かつ x^2+y^2=n を満たす整数の組 (x,y) がただ 1 つ存在する。\u003c/p>"},{"id":"abc439_d","title":"D - Kadomatsu Subsequence","url":"https://atcoder.jp/contests/abc439/tasks/abc439_d?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\dots,A_N) が与えられます。 以下を全て満たす整数の 3 つ組 (i,j,k) がいくつあるか求めてください。 条件：1 \\le i,j,k \\le N / A_i : A_j : A_k = 7:5:3\u003c/p>"},{"id":"abc438_c","title":"C - 1D puyopuyo","url":"https://atcoder.jp/contests/abc438/tasks/abc438_c?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\ldots,A_N) が与えられます。 あなたは以下の操作を 0 回以上好きな順番で好きな回数行うことができます： 問：操作を繰り返した後の最終的な |A| としてあり得る最小値を求めてください。 条件：A_k=A_{k+1}=A_{k+2}=A_{k+3} を満たす 1 以上 |A|-3 以下の整数 k を選び、 A から A_k,A_{k+1},A_{k+2},A_{k+3} を削除する。\u003c/p>"},{"id":"abc438_d","title":"D - Tail of Snake","url":"https://atcoder.jp/contests/abc438/tasks/abc438_d?lang=ja","summary":"\u003cp>すぬけ君は蛇を観察しており、どこからどこまでが頭・胴・尾なのかが気になっています。 すぬけ君は蛇を N 個のブロックに区切り、それぞれのブロックについて頭らしさ・胴らしさ・尾らしさを評価しました。 そして、 らしさ の合計が最大になる分け方を考えることにしました。 長さ N の整数列 A = (A_1, A_2, \\ldots, A_N) , B = (B_1, B_2, \\ldots, B_N) , C = (C_1, C_2, \\ldots, C_N) が与えられます。 問：整数の組 (x, y) が 1 \\leq x &lt; y &lt; N を満たすとき、 \\displaystyle\\sum_{i = 1}^{x} A_i + \\sum_{i = x + 1}^{y} B_i + \\sum_{i = y + 1}^{N} C_i の値として取り得る最大値を求めてください。\u003c/p>"},{"id":"abc437_c","title":"C - Reindeer and Sleigh 2","url":"https://atcoder.jp/contests/abc437/tasks/abc437_c?lang=ja","summary":"\u003cp>N 匹のトナカイと 1 個のソリがあります。 i 番目のトナカイは重さが W_i で力は P_i です。 各トナカイについて、「ソリを引く」または「ソリに乗る」のいずれかを選びます。 ただし、ソリを引くトナカイの力の総和が、ソリに乗るトナカイの重さの総和以上でなければなりません。 最大で何匹トナカイをソリに乗せることができますか？ 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。\u003c/p>"},{"id":"abc437_d","title":"D - Sum of Differences","url":"https://atcoder.jp/contests/abc437/tasks/abc437_d?lang=ja","summary":"\u003cp>長さ N の正整数列 A = (A_1, A_2, \\dots, A_N) および長さ M の正整数列 B = (B_1, B_2, \\dots, B_M) が与えられます。 問：\\displaystyle \\sum_{i=1}^{N} \\sum_{j=1}^{M} |A_i - B_j| の値を 998244353 で割ったあまりを求めてください。\u003c/p>"},{"id":"abc436_c","title":"C - 2x2 Placing","url":"https://atcoder.jp/contests/abc436/tasks/abc436_c?lang=ja","summary":"\u003cp>N 行 N 列のマス目があります。 上から i 行目、左から j 列目のマスを (i,j) と表記します。 はじめ、マス目の上には何も置かれていません。 今から M 回の操作を行います。 i 回目 (1\\leq i\\leq M) の操作は以下の通りです。 問：全ての操作を行った後、マス目の上に何個のブロックが置かれているか求めてください。 条件：マス (R_i,C_i) を左上とする 2 \\times 2 の領域を占めるブロックを、既に置かれている他のブロックと位置が重ならない場合、またその場合に限り、マス目の上に置く。\u003c/p>"},{"id":"abc436_d","title":"D - Teleport Maze","url":"https://atcoder.jp/contests/abc436/tasks/abc436_d?lang=ja","summary":"\u003cp>H 行 W 列のマス目からなる迷路があります。 上から i 行目、左から j 列目のマスを (i,j) と表記します。 マス (i,j) がどのようなマスであるかは文字 S_{i,j} として与えられ、各文字の意味は以下の通りです。 迷路内では、以下の二種類の行動を好きな順序で何回でも行うことができます。 問：マス (1,1) からマス (H,W) へ移動することが可能かどうか判定し、可能ならばそれに必要な最小の合計行動回数を求めてください。 条件：. : 空きマス / # : 障害物マス\u003c/p>"},{"id":"abc435_c","title":"C - Domino","url":"https://atcoder.jp/contests/abc435/tasks/abc435_c?lang=ja","summary":"\u003cp>N 個のドミノが数直線上に一列に並んでいます。 i 番目のドミノは座標 i の位置に立っており、高さは A_i です。 i 番目のドミノが右に倒れると、座標 i 以上 i+A_i 未満の範囲にあるドミノが全て右に倒れます。 問：1 番目のドミノを右に倒したとき、全部でいくつのドミノが倒れますか？\u003c/p>"},{"id":"abc435_d","title":"D - Reachability Query 2","url":"https://atcoder.jp/contests/abc435/tasks/abc435_d?lang=ja","summary":"\u003cp>N 頂点 M 辺の有向グラフが与えられます。 頂点には 1 から N の番号がついており、 i 番目の辺は頂点 X_i から頂点 Y_i への有向辺です。 最初全ての頂点は白色です。 問：Q 個のクエリが与えられるので順に処理してください。クエリは以下の 2 種類のいずれかです。 条件：1 v ：頂点 v を黒色にする / 2 v ：頂点 v から辺を辿って黒色の頂点に到達可能かどうか判定する\u003c/p>"},{"id":"abc434_c","title":"C - Flapping Takahashi","url":"https://atcoder.jp/contests/abc434/tasks/abc434_c?lang=ja","summary":"\u003cp>高橋君は風船で空を飛ぶことにしました。高橋君は時刻 0 (単位は秒) の時点で高度 H にいて、これから 10^9 秒間飛行します。 高橋君は自身が飛んでいる高度を 1 秒あたり 1 まで変化させることが出来ます。ただし、高度を 0 以下にすることはできません。 問：T 個のテストケースが与えられるので、それぞれに対して答えを求めてください。 条件：言い換えると、高橋君の時刻 t における高度を F(t) とした時、 F(t) は以下の条件を全て満たします。 F(0) = H 0 \\leq t \\lt u \\leq 10^9 において -1 \\leq \\dfrac{F(u) - F(t…\u003c/p>"},{"id":"abc434_d","title":"D - Clouds","url":"https://atcoder.jp/contests/abc434/tasks/abc434_d?lang=ja","summary":"\u003cp>空は 2000 \\times 2000 のマス目で表されます。 空を見上げた時、上から r 行目、左から c 列目にあるマスを (r,c) と呼びます。 いま、この空には雲 1,2,\\dots,N が浮かんでいます。 整数の組 (r,c) が U_i \\le r \\le D_i, L_i \\le c \\le R_i を満たすとき、またその時に限り、 (r,c) は雲 i で覆われて… 問：k=1,2,\\dots,N について、以下の問いに答えてください。 条件：N 個の雲のうち、雲 k のみを取り除く。この時点で空には N-1 個の雲が浮かんでいる。このとき、どの雲にも覆われていないマスがいくつあるか答えよ。\u003c/p>"},{"id":"abc433_c","title":"C - 1122 Substring 2","url":"https://atcoder.jp/contests/abc433/tasks/abc433_c?lang=ja","summary":"\u003cp>数字からなる文字列 S が与えられます。 以下の条件を全て満たす文字列 T を 1122文字列 と呼びます。（定義は F 問題と同じです。） 問：ただし、ある二つの部分文字列が文字列として同じでも、取り出された位置が異なるならばそれらは別々に数えるものとします。 条件：T は数字からなる空でない文字列 / |T| は偶数。ここで、 |T| は文字列 T の長さを表す\u003c/p>"},{"id":"abc433_d","title":"D - 183183","url":"https://atcoder.jp/contests/abc433/tasks/abc433_d?lang=ja","summary":"\u003cp>正整数 x,y に対して f(x,y) を以下のように定義します。 例えば f(12,3) = 123 、 f(100,40)=10040 です。 問：以下の条件を全て満たす整数の組 (i,j) の個数を求めてください。 条件：先頭に余分な 0 を付けない十進表記の x,y をそれぞれ文字列として解釈しこの順に連結して得られる文字列を S としたときの、 S を十進表記の整数として解釈した値。 / 1\\le i,j\\le N\u003c/p>"},{"id":"abc432_c","title":"C - Candy Tribulation","url":"https://atcoder.jp/contests/abc432/tasks/abc432_c?lang=ja","summary":"\u003cp>あなたは小さな飴と大きな飴の 2 種類の飴を無尽蔵に持っています。 小さな飴の重量は X グラム、大きな飴の重量は Y グラムであり、小さな飴よりも大きな飴のほうが重い (すなわち、 X &lt; Y ) です。 N 人の子供がいます。子供たちには 1 から N までの番号が付けられています。 問：条件を満たす配り方が存在するかを判定してください。存在する場合はそのような配り方における、大きな飴を配る個数としてあり得る最大値を求めてください。 条件：i=1,\\dots,N について、子供 i には 2 種類の飴を合計でちょうど A_i 個配る。 / N 人の子供それぞれに配る飴の総重量はすべて等しい。\u003c/p>"},{"id":"abc432_d","title":"D - Suddenly, A Tempest","url":"https://atcoder.jp/contests/abc432/tasks/abc432_d?lang=ja","summary":"\u003cp>無限に広がる二次元グリッドがあります。マス (x,y) の色は、 0 \\leq x \\leq X-1 かつ 0 \\leq y \\leq Y-1 ならば黒であり、そうでなければ白です。 このグリッドに対して N 個の大嵐が順に発生します。 i 回目の大嵐は、文字 C_i と整数 A_i, B_i で表される法則にしたがって、グリッド上の各マスの色を更新します。 問：N 個の大嵐がすべて発生した後のグリッドについて、連結成分の個数を求め、各連結成分におけるマスの個数を 昇順に 出力してください。 条件：C_i が X の場合、 x &lt; A_i ならば、大嵐が起きる前のマス (x, y + B_i) の色になる。 x \\geq A_i ならば、大嵐が起きる前のマス (x, y - B_i) の色になる。\u003c/p>"},{"id":"abc431_c","title":"C - Robot Factory","url":"https://atcoder.jp/contests/abc431/tasks/abc431_c?lang=ja","summary":"\u003cp>高橋くんは、頭パーツを 1 個と体パーツを 1 個組み合わせてロボットを 1 体作ることができます。 ロボットは頭パーツの重さが体パーツの重さより大きいと倒れてしまいます。 現在、高橋くんは頭パーツを N 個と体パーツを M 個持っています。 高橋くんが持っている i 番目 (1\\le i\\le N) の頭パーツの重さは H _ i グラム、 i 番目 (1\\le i\\le M) の体パーツの重さは… 問：高橋くんは、持っているパーツを適切に組み合わせることで、倒れないロボットを合計 K 体作りたいです。 うまくパーツを組み合わせることで高橋くんが目標を達成することができるか判定してください。\u003c/p>"},{"id":"abc431_d","title":"D - Robot Customize","url":"https://atcoder.jp/contests/abc431/tasks/abc431_d?lang=ja","summary":"\u003cp>頭と体からなるロボットがあります。 このロボットには、同時に取り付けられる部品が種類 1, 種類 2,\\ldots, 種類 N の N 種類あります。 種類 i\\ (1\\le i\\le N) の部品の重さは W _ i です。 それぞれの部品には、頭に取り付けたときと体に取り付けたときで異なる 嬉しさ があります。 ロボットは頭の重さが体の重さより大きいと倒れてしまいます。 ここで、頭の重さおよび体の重さはそれぞれ頭もしくは体に取り付けられた部品の重さの合計とします。 問：高橋くんは、 N 種類の部品をすべて 1 個ずつロボットに取り付けたいと思っています。 ロボットを倒さないように部品を取り付けたときの、すべての部品の嬉しさの合計としてありえる最大値を求めてください。\u003c/p>"},{"id":"abc430_c","title":"C - Truck Driver","url":"https://atcoder.jp/contests/abc430/tasks/abc430_c?lang=ja","summary":"\u003cp>AtCoder 国には「トラック運転手は A 分以上運転する際には B 分以上の休憩を取らなければならない」というルールがあります。 問：a , b からなる長さ N の文字列 S と正整数 A,B が与えられます。以下の条件を全て満たす整数組 (l,r) の個数を求めてください。 条件：1\\leq l \\leq r \\leq N / S の l 文字目から r 文字目までに含まれる a の個数が A 以上\u003c/p>"},{"id":"abc430_d","title":"D - Neighbor Distance","url":"https://atcoder.jp/contests/abc430/tasks/abc430_d?lang=ja","summary":"\u003cp>数直線があり、最初は座標 0 に人 0 がひとりで立っています。 これから、人 1,2,\\dots,N がこの順に到着し、数直線上に立ちます。 人 i は座標 X_i に立ちます。なお、 X_i \\ge 1 であり、全ての人について X_i は相異なります。 問：人が到着するたびに、以下の問いに答えてください。 条件：現在数直線に人 0,1,\\dots,r の r+1 人が立っているとする。 / このとき、 d_i を「人 i に最も近い別の人までの距離」と定義する。\u003c/p>"},{"id":"abc429_c","title":"C - Odd One Subsequence","url":"https://atcoder.jp/contests/abc429/tasks/abc429_c?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\ldots,A_N) が与えられます。 1\\leq i&lt;j&lt;k\\leq N をみたす整数の組 (i,j,k) であって、 次の条件をみたすものの個数を求めてください。\u003c/p>"},{"id":"abc429_d","title":"D - On AtCoder Conference","url":"https://atcoder.jp/contests/abc429/tasks/abc429_d?lang=ja","summary":"\u003cp>1 周の長さが M である池があり、その周上に 1 つの小屋と N 人の人が立っています。 実数 x (0\\leq x &lt;M) について、小屋から時計回りに x だけ進んだところを地点 x と定義します。 i 番目の人は、 地点 A_i にいます。 複数の人が同じ場所に立っていることもあります。 また、 N 以下の整数 C が与えられます。 i=0,1,\\ldots,M-1 について、 X_i を次のように定義します。 問：i=0,1,\\ldots,M-1 にわたる X_i の総和、すなわち \\displaystyle\\sum_{i=0}^{M-1} X_i を求めてください。 条件：高橋君は地点 (i+0.5) からスタートして、時計回りに動き始める。 / 高橋君は出会った人数の合計が C 未満である限り（時計回りに）動き続け、 C 以上になったら止まる。\u003c/p>"},{"id":"abc428_c","title":"C - Brackets Stack Query","url":"https://atcoder.jp/contests/abc428/tasks/abc428_c?lang=ja","summary":"\u003cp>文字列 T が次の条件を満たすとき、 T を良い括弧列と呼びます。 次の操作を 0 回以上繰り返すことで T を空文字列にすることができる。 問：文字列 S があります。 S ははじめ空文字列です。 以下で説明されるクエリを与えられる順に Q 個処理してください。そして、各クエリの直後に S が良い括弧列であるかを判定してください。 クエリは次の 2 種類です。 条件：次の操作を 0 回以上繰り返すことで T を空文字列にすることができる。 T に(連続な)部分文字列として含まれる () を選び、これを取り除く。 / T に(連続な)部分文字列として含まれる () を選び、これを取り除く。\u003c/p>"},{"id":"abc428_d","title":"D - 183184","url":"https://atcoder.jp/contests/abc428/tasks/abc428_d?lang=ja","summary":"\u003cp>正整数 x,y に対して f(x,y) を以下で定義します。 たとえば f(3,14)=314,\\ f(100,3)=1003 です。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：十進表記の x,y をそれぞれ文字列として解釈しこの順に連結して得られる文字列を z とする。 z を十進表記の整数として解釈したときの値を f(x,y) とする。 / 1 \\leq x \\leq D\u003c/p>"},{"id":"abc427_c","title":"C - Bipartize","url":"https://atcoder.jp/contests/abc427/tasks/abc427_c?lang=ja","summary":"\u003cp>N 頂点 M 辺の単純な無向グラフがあります。 グラフは頂点 1, 頂点 2,\\ldots, 頂点 N からなり、 i 番目 (1\\le i\\le M) の辺は頂点 u _ i と頂点 v _ i を結んでいます。 あなたは、次の操作を 0 回以上行います。 問：あなたの目的はグラフを二部グラフにすることです。 操作を行ったあとのグラフを二部グラフにするために、最低でも何回操作を行う必要があるか求めてください。 条件：まだ削除されていない辺をひとつ選び、削除する。 / どの辺についても、その辺が結んでいるふたつの頂点に塗られた色は異なる。\u003c/p>"},{"id":"abc427_d","title":"D - The Simple Game","url":"https://atcoder.jp/contests/abc427/tasks/abc427_d?lang=ja","summary":"\u003cp>N 頂点 M 辺の有向グラフがあります。頂点には 1 から N までの番号が付けられており、 i 番目の辺は頂点 U_i から頂点 V_i へ向かう有向辺です。ここで、各頂点の出次数は 1 以上です。 また、各頂点には文字が書かれており、頂点 i に書かれている文字は S_i です。ただし、 S_i とは S の i 文字目を指します。 問：1 つの入力において T 個のテストケースが与えられます。それぞれについて答えてください。 条件：はじめ、駒は頂点 1 に置かれており、Alice が先手、Bob が後手となって以下の操作を交互に K 回ずつ行う。 現在駒が置かれている頂点を u とする。\u003c/p>"},{"id":"abc426_c","title":"C - Upgrade Required","url":"https://atcoder.jp/contests/abc426/tasks/abc426_c?lang=ja","summary":"\u003cp>ある OS のバージョンは N 個あり、古い順に 1,2,\\dots,N の番号がついています。 PC が N 台あり、初めは i 番目の PC の OS のバージョンは i です。 Q 回の操作を順に行ってください。そのうち i 回目は次の通りです。 問：i&lt;Q について、 i 回目の操作でのアップグレードが行われた状態で i+1 回目の操作に進むことに注意してください。 条件：現時点での OS のバージョンが X_i かそれ以前の PC 全てを、バージョンを Y_i(&gt;X_i) にアップグレードする。その後、この操作でアップグレードを行った PC の台数を出力する。\u003c/p>"},{"id":"abc426_d","title":"D - Pop and Insert","url":"https://atcoder.jp/contests/abc426/tasks/abc426_d?lang=ja","summary":"\u003cp>0 および 1 からなる長さ N の文字列 S が与えられます。 あなたは S に対して以下の操作を好きな回数（ 0 回でもよい）行うことができます。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：先頭または末尾の 1 文字を削除し、その文字を反転して（ 0 ならば 1 に、 1 ならば 0 に変えて）、好きな位置に挿入し直す。 より厳密には、 r( 0 )= 1 ,r( 1 )= 0 として、以下のいずれかを行う。\u003c/p>"},{"id":"abc425_c","title":"C - Rotate and Sum Query","url":"https://atcoder.jp/contests/abc425/tasks/abc425_c?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\ldots,A_N) が与えられます。 問：Q 個のクエリが与えられるので順に処理してください。クエリは 2 種類あり、以下のいずれかの形式で与えられます。 条件：1 c ： A の先頭の要素を末尾に移動させる操作を c 回行う。 / 2 l r ： \\displaystyle \\sum_{i=l}^r A_i の値を出力する。\u003c/p>"},{"id":"abc425_d","title":"D - Ulam-Warburton Automaton","url":"https://atcoder.jp/contests/abc425/tasks/abc425_d?lang=ja","summary":"\u003cp>H 行 W 列のマス目があります。上から i 行目 (1\\leq i\\leq H) 、左から j 列目 (1\\leq j\\leq W) のマスをマス (i,j) と呼ぶことにします。 はじめ、マス (i,j) は S_{i,j} が # のとき黒、 . のとき白で塗られています。 問：すべての操作が終わったあとに黒く塗られているマスの個数を求めてください。 条件：白で塗られているマスであって、そのマスに辺で隣接するマスのうちちょうど 1 つが黒で塗られているようなマスの集合を T とする。 T の各マスに対して、そのマスを黒で塗る。\u003c/p>"},{"id":"abc424_c","title":"C - New Skill Acquired","url":"https://atcoder.jp/contests/abc424/tasks/abc424_c?lang=ja","summary":"\u003cp>高橋君はゲームをしています。このゲームには 1 から N の番号がついた N 個のスキルがあります。 N 個の整数の組 (A_1,B_1), \\dots,(A_N,B_N) が与えられます。 (A_i,B_i)=(0,0) のとき高橋君はスキル i を習得済みです。 問：既に取得済みのスキルも含め、高橋君が最終的に習得することができるスキルの個数を求めてください。\u003c/p>"},{"id":"abc424_d","title":"D - 2x2 Erasing 2","url":"https://atcoder.jp/contests/abc424/tasks/abc424_d?lang=ja","summary":"\u003cp>H 行 W 列のマス目があり、各マスは白または黒に塗られています。 マス目の上から i 番目 (1\\leq i\\leq H) かつ左から j 番目 (1\\leq j\\leq W) のマスをマス (i,j) と表すことにします。 高橋君はいくつか（ 0 個でも良い）の黒く塗られたマスを白に塗り替えることで、 マス目が黒く塗られたマスのみからなる 2\\times 2 の部分を持たないようにしたいです。 より厳密には、次の条件をみたすようにしたいです。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。\u003c/p>"},{"id":"abc423_c","title":"C - Lock All Doors","url":"https://atcoder.jp/contests/abc423/tasks/abc423_c?lang=ja","summary":"\u003cp>N + 1 個の部屋が一列に並んでおり、順に 0, 1, \\ldots, N の番号が付けられています。 部屋の間には N 個のドアがあり、 1, 2, \\ldots, N の番号が付けられています。ドア i は部屋 i - 1 と部屋 i の間にあります。 問：すべてのドアの鍵が閉まった状態にするために行う鍵の開閉操作の回数として考えられる最小値を求めてください。\u003c/p>"},{"id":"abc423_d","title":"D - Long Waiting","url":"https://atcoder.jp/contests/abc423/tasks/abc423_d?lang=ja","summary":"\u003cp>同時に最大 K 人の客を入れられるレストラン店があります。この店の前には脇道があり、ここで 1 つの待ち行列を管理しています。 時刻 0 の時点で店内に客はおらず、待ち行列も空です。 問：それぞれの団体客が入店する時刻を求めてください。 条件：その団体客は、待ち行列の先頭にいる。つまりその団体客は、その時点で待ち行列にいる団体客のうち、最も早く待ち行列に加わっている。\u003c/p>"},{"id":"abc422_c","title":"C - AtCoder AAC Contest","url":"https://atcoder.jp/contests/abc422/tasks/abc422_c?lang=ja","summary":"\u003cp>高橋くんは、文字をいくつか持っています。 高橋くんが持っている文字は A , B , C のいずれかです。 はじめ、高橋くんは A を n _ A 個、 B を n _ B 個、 C を n _ C 個持っています。 高橋くんは、 A を 1 つ、 C を 1 つ、さらに追加で任意の 1 つの文字の合計 3 文字を使うことで、コンテストを 1 つ開催することができます。 問：T 個のテストケースが与えられるので、それぞれについて答えてください。\u003c/p>"},{"id":"abc422_d","title":"D - Least Unbalanced","url":"https://atcoder.jp/contests/abc422/tasks/abc422_d?lang=ja","summary":"\u003cp>N を正整数とします。長さ 2^N の非負整数列 A=(A_1, A_2, \\dots, A_{2^N}) の アンバランスさ を次の操作によって得られる非負整数値として定義します。 例えば N=2, A=(6, 8, 3, 5) は以下の手順によりアンバランスさが 6 であるとわかります。 問：非負整数 K が与えられます。長さ 2^N の非負整数列であって総和が K であるものの中で、アンバランスさが最小値を取る数列を構成してください。 条件：はじめ、 X=0 とする。 / 次の一連の操作を N 回行う。 X を \\max(X, \\max(A) - \\min(A)) に更新する。ここで \\max(A) および \\min(A) は数列 A の最大値と最小値を意味する。\u003c/p>"},{"id":"abc421_c","title":"C - Alternated","url":"https://atcoder.jp/contests/abc421/tasks/abc421_c?lang=ja","summary":"\u003cp>長さ 2N の文字列 S が与えられます。 S は A , B を N 個ずつ含みます。 問：S に対して隣り合う文字を入れ替える操作を好きな回数( 0 回でもよい)行って、同じ文字が隣り合う箇所がない状態にするために必要な操作回数の最小値を求めてください。\u003c/p>"},{"id":"abc421_d","title":"D - RLE Moving","url":"https://atcoder.jp/contests/abc421/tasks/abc421_d?lang=ja","summary":"\u003cp>無限に広いグリッドがあります。グリッドのあるマスはマス (0,0) と名前がついています。 マス (0,0) から下に r マス、右に c マスの移動した位置にあるマスをマス (r,c) と呼びます。 ここで、「下に r マス移動する」は r が負のときは「上に |r| マス移動する」ことを表し、「右に c マス移動する… 問：N 回の移動の中で、移動直後に高橋君と青木君が同じマスにいた回数を求めてください。\u003c/p>"},{"id":"abc420_c","title":"C - Sum of Min Query","url":"https://atcoder.jp/contests/abc420/tasks/abc420_c?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\ldots,A_N),B=(B_1,B_2,\\ldots,B_N) が与えられます。 Q 個のクエリが与えられるので順に処理してください。 i 番目 (1\\le i\\le Q) のクエリは以下で説明されます。 問：文字 c_i と整数 X_i,V_i が与えられる。 c_i= A ならば A_{X_i} を、 c_i= B ならば B_{X_i} を V_i に変更する。その後、 \\displaystyle \\sum_{k=1}^N \\min(A_k,B_k) を出力する。\u003c/p>"},{"id":"abc420_d","title":"D - Toggle Maze","url":"https://atcoder.jp/contests/abc420/tasks/abc420_d?lang=ja","summary":"\u003cp>H 行 W 列のグリッドがあります。上から i 行目、左から j 列目のマス目を (i,j) と表します。各マスの状態は文字 A_{i,j} で表され、意味は以下の通りです。 高橋君は、 1 回の操作で今いるマスから上下左右に隣り合う、障害物マスでも閉じたドアでもないマスへ移動することができます。 問：高橋君がはじめスタートマスにいる状態からゴールマスにいる状態にするよう操作できるか判定し、可能な場合は必要な操作回数の最小値を求めてください。 条件：. ：空きマス。 / # ：障害物マス。\u003c/p>"},{"id":"abc419_c","title":"C - King's Summit","url":"https://atcoder.jp/contests/abc419/tasks/abc419_c?lang=ja","summary":"\u003cp>10^9 行 10^9 列のグリッドがあり、このグリッドの上から i 番目、左から j 番目のマスをマス (i, j) と表記します。 グリッド上には N 人の人がおり、はじめ i 人目の人はマス (R_i, C_i) にいます。 問：N 人の人が全員同じマスに集まる時刻として考えられる最小値を求めてください。 条件：その場に留まるか、 8 近傍のマスに移動する。ただし、グリッドの外側に出ることはできない。厳密には、現在いるマスをマス (i, j) としてマス (i - 1, j - 1), (i - 1, j), (i - 1, j + 1), (i,…\u003c/p>"},{"id":"abc419_d","title":"D - Substr Swap","url":"https://atcoder.jp/contests/abc419/tasks/abc419_d?lang=ja","summary":"\u003cp>長さ N の英小文字列 S, T および M 個の整数の組 (L_1,R_1),(L_2,R_2),\\ldots,(L_M,R_M) が与えられます。 i=1,2,\\ldots,M の順に以下の操作を行います。 問：M 回の操作を行った後の S を求めてください。 条件：S の L_i 文字目から R_i 文字目と、 T の L_i 文字目から R_i 文字目を入れ替える。 例えば、 S が abcdef 、 T が ghijkl 、 (L_i,R_i)=(3,5) のとき、操作後の S,T はそれぞれ a…\u003c/p>"},{"id":"abc418_c","title":"C - Flush","url":"https://atcoder.jp/contests/abc418/tasks/abc418_c?lang=ja","summary":"\u003cp>ポーカーテーブルの上に N 種類のフレーバーのティーバッグが置かれています。フレーバーには 1 から N までの番号が付けられており、フレーバー i ( 1 \\leq i \\leq N ) のティーバッグは A_i 個あります。 あなたはこれらのティーバッグを使ったゲームに参加します。ゲームには 1 以上 A_1 + \\dots + A_N 以下の 難易度 が設定されており，難易度 b のゲームは以下の流れで行われます。 問：Q 個の質問が与えられるので、それぞれに答えてください。 j 番目の質問は以下の通りです。 条件：あなたは整数 x を宣言する。このとき、 b \\leq x \\leq A_1 + \\dots + A_N を満たす必要がある。 / ディーラーはポーカーテーブルの上にあるティーバッグの中からちょうど x 個を選び、あなたに渡す。\u003c/p>"},{"id":"abc418_d","title":"D - XNOR Operation","url":"https://atcoder.jp/contests/abc418/tasks/abc418_d?lang=ja","summary":"\u003cp>この問題は G 問題の部分問題です。 0 と 1 からなる空でない文字列 S が次の条件を満たす時、 S を美しい文字列と呼びます。 問：0 と 1 からなる長さ N の文字列 T があります。 T の部分文字列である美しい文字列の個数を求めてください。ただし、 2 つの部分文字列が文字列として同じでも、取り出す位置が異なるならば別々に数えます。 条件：(条件) 次の一連の操作を S の長さが 1 になるまで行い、 S に残った唯一の文字を 1 にすることができる。 1 \\leq i \\leq |S| - 1 を満たす整数 i を自由に選ぶ。 整数 x を次のように定義する。\u003c/p>"},{"id":"abc417_c","title":"C - Distance Indicators","url":"https://atcoder.jp/contests/abc417/tasks/abc417_c?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A _ 1,A _ 2,\\ldots,A _ N) が与えられます。 問：整数の 2 つ組 (i,j)\\ (1\\le i\\lt j\\le N) のうち、 j-i=A _ i+A _ j を満たすものがいくつあるか求めてください。\u003c/p>"},{"id":"abc417_d","title":"D - Takahashi's Expectation","url":"https://atcoder.jp/contests/abc417/tasks/abc417_d?lang=ja","summary":"\u003cp>高橋くんは、これから N 個のプレゼントをもらいます。 高橋くんにはテンションという非負整数のパラメータがあり、テンションはプレゼントをもらうごとに変動します。 それぞれのプレゼントは価値 P 、テンション上げ度 A 、テンション下げ度 B という 3 つのパラメータをもち、これらのパ… 問：高橋くんのテンションがはじめ X _ i だったときの、 N 個のプレゼントをすべて受け取ったあとの高橋くんのテンションを求めよ。 条件：もらったプレゼントの価値 P がテンションの値以上であるとき、高橋くんはプレゼントに喜び、テンションが A だけ増加する。 / もらったプレゼントの価値 P がテンションの値より小さいとき、高橋くんはプレゼントにがっかりし、テンションが B…\u003c/p>"},{"id":"abc416_c","title":"C - Concat (X-th)","url":"https://atcoder.jp/contests/abc416/tasks/abc416_c?lang=ja","summary":"\u003cp>N 個の文字列 S_1,\\ldots,S_N が与えられます。 全ての要素が 1 以上 N 以下であるような長さ K の数列 (A_1,\\ldots,A_K) に対し、 文字列 f(A_1,\\ldots,A_K) を S_{A_1}+S_{A_2}+\\dots+S_{A_K} と定めます。 問：N^K 個の数列全てについての f(A_1,\\dots,A_K) を辞書順に並べたとき、小さい方から X 番目の文字列を求めてください。\u003c/p>"},{"id":"abc416_d","title":"D - Match, Mod, Minimize 2","url":"https://atcoder.jp/contests/abc416/tasks/abc416_d?lang=ja","summary":"\u003cp>長さ N の非負整数列 A=(A_1,A_2,\\ldots,A_N), B=(B_1,B_2,\\ldots,B_N) と正整数 M が与えられます。 A の要素を自由に並び替えることが出来るとき、 \\displaystyle \\sum_{i=1}^N \\left((A_i+B_i) \\bmod M\\right) としてありうる最小値を求めて下さい。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。\u003c/p>"},{"id":"abc415_c","title":"C - Mixture","url":"https://atcoder.jp/contests/abc415/tasks/abc415_c?lang=ja","summary":"\u003cp>N 種類の薬品 1,2,\\dots,N があります。あなたの目標はこれらが全て混ざった状態にすることです。 0 , 1 からなる長さ 2^N-1 の文字列 S が与えられます。この文字列は次の情報を表します。 あなたは次の操作を使って薬品を混ぜ合わせます。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：まず、 1 種類以上の薬品が混ざった状態 i ( 1 \\le i \\le 2^N-1 ) を次のように定義する。 i を 2 進法で表記した際に下から k ( 1 \\le k \\le N ) 桁目が 1 である、またその時に限り、薬品 k…\u003c/p>"},{"id":"abc415_d","title":"D - Get Many Stickers","url":"https://atcoder.jp/contests/abc415/tasks/abc415_d?lang=ja","summary":"\u003cp>本問題の設定は G 問題と類似しています。G 問題とは、最大化の対象および制約の一部が異なります。 不思議なコーラショップがあります。 このショップは直接コーラを売ることはしませんが、コーラの空き瓶と新しい瓶入りコーラとの交換サービスを提供しています。 問：高橋君はシールが大好きです。うまく行動を取ったとき、最大で何枚のシールを手に入れることができますか？ 条件：持っている瓶入りコーラ 1 本を飲む。持っている瓶入りコーラの本数が 1 減り、空き瓶の本数が 1 増える。 （行動前に 1 本も瓶入りコーラを持っていない場合、この行動は取れない。） / 1 以上 M 以下の整数 i を選ぶ。\u003c/p>"},{"id":"abc414_c","title":"C - Palindromic in Both Bases","url":"https://atcoder.jp/contests/abc414/tasks/abc414_c?lang=ja","summary":"\u003cp>414 の十進法での表記は 414 であり、これは回文です。 また、 414 の八進法での表記は 636 であり、これも回文です。 これを踏まえて、以下の問題を解いてください。 正の整数 A, N が与えられます。 1 以上 N 以下の整数のうち、十進法での表記も A 進法での表記も回文であるようなものの総和を求めてください。 問：なお、この問題の制約下で答えは 2^{63} 未満であることが証明できます。\u003c/p>"},{"id":"abc414_d","title":"D - Transmission Mission","url":"https://atcoder.jp/contests/abc414/tasks/abc414_d?lang=ja","summary":"\u003cp>数直線上に N 棟の家があり、 1 から N までの番号が付けられています。 家 i は座標 X_i に位置しています。同じ座標に複数の家が位置していることもあります。 あなたは M 個の基地局を数直線上の任意の実数座標に配置します。そして、それぞれの基地局に対して非負整数の値の 電波強度 を設定します。 問：なお、制約を満たす任意の入力に対して答えが整数であることが証明できます。\u003c/p>"},{"id":"abc413_c","title":"C - Large Queue","url":"https://atcoder.jp/contests/abc413/tasks/abc413_c?lang=ja","summary":"\u003cp>空の整数列 A=() があります。クエリが Q 個与えられるので、与えられた順に処理してください。クエリは以下の 2 種類です。 条件：タイプ 1 : 1 c x の形式で与えられる。 A の末尾に x を c 個追加する。 / タイプ 2 : 2 k の形式で与えられる。 A の先頭 k 要素を削除し、削除した k 個の整数の総和を出力する。\u003c/p>"},{"id":"abc413_d","title":"D - Make Geometric Sequence","url":"https://atcoder.jp/contests/abc413/tasks/abc413_d?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A _ 1,A _ 2,\\ldots,A _ N) が与えられます。 ここで、どの i\\ (1\\le i\\le N) についても A _ i が 0 でないことが保証されます。 ただし、数列 S=(S _ 1,S _ 2,\\ldots,S _ N) が等比数列であるとは、ある実数 r が存在してすべての整数 1\\le i\\lt N に対して S _ {i+1}=rS _ i が成り立つことをいいます。 問：A を適切に並べ替えた数列 B=(B _ 1,B _ 2,\\ldots,B _ N) が等比数列になることがあるか判定してください。\u003c/p>"},{"id":"abc412_c","title":"C - Giant Domino","url":"https://atcoder.jp/contests/abc412/tasks/abc412_c?lang=ja","summary":"\u003cp>1 から N までの番号がついた N 個のドミノがあります。ドミノ i の大きさは S_i です。 いくつかのドミノを左右一列に並べたあとにドミノを倒すことを考えます。ドミノ i が右に向けて倒れる時、ドミノ i のすぐ右に置かれているドミノの大きさが 2 S_i 以下ならばそのドミノも右に向けて倒れます。 あなたは 2 個以上のドミノを選んで左右一列に並べることにしました。ただし、ドミノの並べ方は次の条件を満たす必要があります。 問：条件を満たすドミノの並べ方は存在しますか？また、存在する場合は最小で何個のドミノを並べる必要がありますか？ 条件：一番左のドミノはドミノ 1 である。 / 一番右のドミノはドミノ N である。\u003c/p>"},{"id":"abc412_d","title":"D - Make 2-Regular Graph","url":"https://atcoder.jp/contests/abc412/tasks/abc412_d?lang=ja","summary":"\u003cp>N 頂点 M 辺の単純無向グラフ G があります。頂点には 1, 2, \\ldots, N の番号が付けられており、 i 番目の辺は頂点 A_i と頂点 B_i を結ぶ無向辺です。 あなたは、以下の 2 つの操作を好きな順序で好きな回数繰り返すことができます。 問：G をすべての頂点の次数が 2 である単純無向グラフにするために行う操作回数として考えられる最小値を求めてください。 条件：G に無向辺を 1 つ追加する / G から無向辺を 1 つ削除する\u003c/p>"},{"id":"abc411_c","title":"C - Black Intervals","url":"https://atcoder.jp/contests/abc411/tasks/abc411_c?lang=ja","summary":"\u003cp>左右一列に N 個のマスが並んでいます。 最初、すべてのマスは白く塗られています。 Q 個のクエリを順に処理してください。 i 個目のクエリでは 1 以上 N 以下の整数 A_i が与えられ、次の操作を行います。 問：左から A_i 番目のマスの色を反転させる。 具体的には、左から A_i 番目のマスが、白く塗られていたならば黒く塗り、黒く塗られていたならば白く塗る。 その後、黒く塗られたマスが連続している区間の個数を求める。 条件：左から l, l+1, \\ldots, r 番目のマスはすべて黒く塗られている。 / l=1 であるか、または左から (l-1) 番目のマスは白く塗られている。\u003c/p>"},{"id":"abc411_d","title":"D - Conflict 2","url":"https://atcoder.jp/contests/abc411/tasks/abc411_d?lang=ja","summary":"\u003cp>1 台のサーバーと N 台の PC があります。 サーバーおよび各 PC はそれぞれ 1 つずつ文字列を保持しており、最初は全て空文字列です。 Q 個のクエリが与えられます。各クエリは以下のいずれかの形式です。 問：全てのクエリを与えられた順に処理したときの最終的なサーバーの文字列を求めてください。 条件：1 p ：PC p の文字列をサーバーの文字列で置き換える。 / 2 p s ：PC p の文字列の末尾に文字列 s を追加する。\u003c/p>"},{"id":"abc410_c","title":"C - Rotatable Array","url":"https://atcoder.jp/contests/abc410/tasks/abc410_c?lang=ja","summary":"\u003cp>長さ N の整数列 A があり、最初 A_i = i です。 以下のクエリを全部で Q 個処理してください。 条件：タイプ 1 : A_p を x に変更する。 / タイプ 2 : A_p を出力する。\u003c/p>"},{"id":"abc410_d","title":"D - XOR Shortest Walk","url":"https://atcoder.jp/contests/abc410/tasks/abc410_d?lang=ja","summary":"\u003cp>頂点に 1 から N の、辺に 1 から M の番号がついた N 頂点 M 辺の有向グラフがあります。辺 i は頂点 A_i から頂点 B_i への 重み W_i の有向辺です。 直感的には、「頂点 1 から頂点 N への経路であって、同じ頂点や同じ辺を複数回通っても良いもの」です。 正確には、辺の列 (e_1,\\ldots,e_k) であって、以下の条件を全て満たすものです。 問：頂点 1 から頂点 N への walk のうち、walk に含まれる辺の重みのビット単位 \\mathrm{XOR} の最小値を求めてください。 条件：e_1 は頂点 1 を始点とする。 / 全ての 1 \\leq i &lt; k について、 e_i の終点と e_{i+1} の始点は一致する。\u003c/p>"},{"id":"abc409_c","title":"C - Equilateral Triangle","url":"https://atcoder.jp/contests/abc409/tasks/abc409_c?lang=ja","summary":"\u003cp>円周が L の円があり、この円周上に点 1,2,\\ldots,N が配置されています。 i=1,2,\\ldots,N-1 に対し、点 i+1 は点 i から時計回りに円周上を d_i 進んだ位置にあります。 問：整数の組 (a,b,c)\\ (1\\leq a\\lt b\\lt c\\leq N) であって、以下の 2 つをともに満たすものの個数を求めてください。 条件：3 点 a,b,c はすべて異なる位置にある。 / 3 点 a,b,c を頂点とする三角形は正三角形である。\u003c/p>"},{"id":"abc409_d","title":"D - String Rotation","url":"https://atcoder.jp/contests/abc409/tasks/abc409_d?lang=ja","summary":"\u003cp>長さ N の英小文字からなる文字列 S=S_1S_2\\dots S_N が与えられます。あなたは、 S に対して以下の操作をちょうど 1 回行います。 操作後の S としてありえる文字列のうち、辞書順最小のものを求めてください。 問：T 個のテストケースが与えられるので、それぞれについて答えてください。 条件：S の長さ 1 以上の連続部分文字列を選んで、左に 1 だけ巡回シフトする。すなわち、整数 1 \\leq \\ell \\leq r \\leq N を選んで、 S の r 文字目の右に S_\\ell を挿入したのち、 S の \\ell 番目の文…\u003c/p>"},{"id":"abc408_c","title":"C - Not All Covered","url":"https://atcoder.jp/contests/abc408/tasks/abc408_c?lang=ja","summary":"\u003cp>AtCoder 王国には 1 から N まで番号がつけられた N 個の城壁があります。また、 M 個の砲台があります。 砲台 i は L_i 以上 R_i 以下の番号の城壁を守っています。 問：どの砲台にも守られていない城壁が存在する状態にするためには、最小で何個の砲台を破壊する必要がありますか？\u003c/p>"},{"id":"abc408_d","title":"D - Flip to Gather","url":"https://atcoder.jp/contests/abc408/tasks/abc408_d?lang=ja","summary":"\u003cp>長さ N の 0 と 1 のみからなる文字列 S が与えられます。 あなたは以下の操作を何回でも( 0 回でもよい)行うことができます。 問：T 個のテストケースが与えられるので、それぞれについて答えを求めてください。 条件：1 \\leq i \\leq N を満たす整数 i を選び、 S_i が 0 のときは 1 に、 1 のときは 0 に変更する。 / 1 \\leq l \\leq r \\leq N+1\u003c/p>"},{"id":"abc407_c","title":"C - Security 2","url":"https://atcoder.jp/contests/abc407/tasks/abc407_c?lang=ja","summary":"\u003cp>AtCoder 社の入口には特殊なパスコード入力装置があり、 この装置は文字列を 1 つ表示する画面と 2 つのボタンからなります。 画面に表示される文字列を t とします。 t ははじめ空文字列であり、ボタンを押すことで t に以下の変化が起きます。 問：文字列 S が与えられます。 t が空文字列である状態からボタンを 0 回以上押して t を S に一致させるとき、ボタンを最少で何回押す必要があるかを求めてください。 条件：ボタン A を押すと、 t の末尾に 0 が追加される。 / ボタン B を押すと、 t に含まれるすべての数字が、それぞれ次の数字に置き換わる。\u003c/p>"},{"id":"abc407_d","title":"D - Domino Covering XOR","url":"https://atcoder.jp/contests/abc407/tasks/abc407_d?lang=ja","summary":"\u003cp>H 行 W 列のマス目があります。 上から i 行目 (1\\leq i\\leq H) 、左から j 列目 (1\\leq j\\leq W) のマスをマス (i,j) と呼ぶことにします。 マス (i,j)\\ (1\\leq i\\leq H,1\\leq j\\leq W) には非負整数 A _ {i,j} が書かれています。 問：ドミノの置き方のスコアとしてありうる最大値を求めてください。 条件：1\\leq i\\leq H,1\\leq j\\lt W に対するマス (i,j) とマス (i,j+1) / 1\\leq i\\lt H,1\\leq j\\leq W に対するマス (i,j) とマス (i+1,j)\u003c/p>"},{"id":"abc406_c","title":"C - ~","url":"https://atcoder.jp/contests/abc406/tasks/abc406_c?lang=ja","summary":"\u003cp>整数列 A = (A_1, A_2, \\ldots, A_{|A|}) に対し、 A が チルダ型 とは以下の 4 つの条件をすべて満たすことであると定義します。 問：数列 (1, 2, \\ldots, N) を並べ替えて得られる数列 P = (P_1, P_2, \\ldots, P_N) が与えられます。 P の連続部分列であってチルダ型である数列の個数を求めてください。 条件：A の長さ |A| は 4 以上である / A_1 &lt; A_2 である\u003c/p>"},{"id":"abc406_d","title":"D - Garbage Removal","url":"https://atcoder.jp/contests/abc406/tasks/abc406_d?lang=ja","summary":"\u003cp>H 行 W 列のマス目があり、上から i 行目、左から j 列目のマスをマス (i, j) と表記します。 マス目の上には N 個のゴミが落ちており、 i 番目のゴミはマス (X_i, Y_i) に落ちています。 問：タイプ 2 : 2 y の形式で入力として与えられる。マス目の y 列目に落ちているゴミの個数を答えとして求める。その後、 y 列目に落ちているゴミはすべて捨てられ、マス目上から取り除かれる。 条件：タイプ 1 : 1 x の形式で入力として与えられる。マス目の x 行目に落ちているゴミの個数を答えとして求める。その後、 x 行目に落ちているゴミはすべて捨てられ、マス目上から取り除かれる。\u003c/p>"},{"id":"abc405_c","title":"C - Sum of Product","url":"https://atcoder.jp/contests/abc405/tasks/abc405_c?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\dots,A_N) が与えられます。 問：\\displaystyle \\sum_{1\\leq i&lt; j\\leq N} A_iA_j の値を求めてください。\u003c/p>"},{"id":"abc405_d","title":"D - Escape Route","url":"https://atcoder.jp/contests/abc405/tasks/abc405_d?lang=ja","summary":"\u003cp>ある日、映画館を訪れた高橋君は、館内の全ての床に、最寄りの非常口の方向を示す矢印を描くことにしました。 縦 H マス、横 W マスのグリッドが与えられます。グリッドの上から i 行目、左から j 列目のマスを (i, j) と呼びます。 各マスの状態は、次のいずれかの文字 S_{i,j} で表されます。 問：このとき、以下の条件を満たすように、すべての通路マスに対して「上下左右いずれかの方向の矢印」を書き込んでください。 条件：. : 通路マス / # : 壁マス\u003c/p>"},{"id":"abc404_c","title":"C - Cycle Graph?","url":"https://atcoder.jp/contests/abc404/tasks/abc404_c?lang=ja","summary":"\u003cp>N 頂点 M 辺の単純無向グラフが与えられます。頂点には 1,2,\\dots,N の番号が、辺には 1,2,\\dots,M の番号がつけられており、辺 i は頂点 A_i と頂点 B_i を結んでいます。 単純無向グラフとは 単純無向グラフとは、自己ループや多重辺を含まず、辺に向きの無いグラフのことをいいます。 問：このグラフがサイクルグラフであるか判定してください。 条件：i = 1, 2, \\dots, N-1 に対して、頂点 v_i と v_{i+1} を結ぶ辺が存在する / 頂点 v_N と v_1 を結ぶ辺が存在する\u003c/p>"},{"id":"abc404_d","title":"D - Goin' to the Zoo","url":"https://atcoder.jp/contests/abc404/tasks/abc404_d?lang=ja","summary":"\u003cp>AtCoder 国には動物園が N 園あり、 1 から N の番号がついています。動物園 i の入園料は C_i 円です。 鈴木さんは M 種類の動物、動物 1,\\ldots,M が好きです。 動物 i は K_i 園の動物園 A_{i,1},\\dots, A_{i,K_i} で見ることができます。 問：M 種類の動物全てを 2 度以上ずつ見るために必要な入園料の合計の最小値を求めてください。 なお、同じ動物園を複数回訪れた場合、その動物園の動物は訪れた回数だけ見たとみなします。\u003c/p>"},{"id":"abc403_c","title":"C - 403 Forbidden","url":"https://atcoder.jp/contests/abc403/tasks/abc403_c?lang=ja","summary":"\u003cp>WAtCoder には N 人のユーザがおり、 1 から N までの番号がつけられています。 また、 M 個のコンテストページがあり、 1 から M までの番号がつけられています。 はじめ、すべてのユーザはどのコンテストページの閲覧権限も持っていません。 Q 個のクエリが与えられるので、順に処理してください。クエリは 3 種類あり、以下のいずれかの形式で与えられます。 問：クエリの中で、あるユーザがすでに閲覧権限を持っているコンテストページについて、重ねて閲覧権限を付与されることもあります。 条件：1 X Y : ユーザ X にコンテストページ Y の閲覧権限を付与する。 / 2 X : ユーザ X にすべてのコンテストページの閲覧権限を付与する。\u003c/p>"},{"id":"abc403_d","title":"D - Forbidden Difference","url":"https://atcoder.jp/contests/abc403/tasks/abc403_d?lang=ja","summary":"\u003cp>長さ N の整数列 A=(A_1,A_2,\\dots,A_N) と非負整数 D が与えられます。 A の要素をいくつか削除して、以下の条件を満たす数列 B を得たいです。 問：最小でいくつの要素を削除すればよいか求めてください。 条件：すべての i,j \\; (1 \\leq i &lt; j \\leq |B|) について、 |B_i-B_j| \\neq D\u003c/p>"},{"id":"abc402_c","title":"C - Dislike Foods","url":"https://atcoder.jp/contests/abc402/tasks/abc402_c?lang=ja","summary":"\u003cp>AtCoderレストランでは 1 から N までの番号がつけられている N 種類の食材を扱っています。 また、AtCoderレストランでは 1 から M までの番号がつけられている M 個の料理を提供しています。料理 i には K_i 種類の食材が使われており、食材 A_{i,1}, A_{i,2}, \\ldots, A_{i,K_… 問：i=1,2,\\ldots,N について以下の値を求めてください。 条件：i 日目にすぬけ君が食材 B_i を克服した直後、すぬけ君が食べることができるAtCoderレストランの料理の個数\u003c/p>"},{"id":"abc402_d","title":"D - Line Crossing","url":"https://atcoder.jp/contests/abc402/tasks/abc402_d?lang=ja","summary":"\u003cp>円周上に N 個の点が等間隔に並んでおり、時計回りに 1,2,\\ldots,N と番号がつけられています。 M 本の相異なる 直線 があり、 i 本目の直線は異なる 2 つの点、点 A_i と点 B_i を通る直線です。 (1 \\leq i \\leq M) 問：以下の 2 つの条件をともに満たすような整数の組 (i,j) の個数を求めてください。 条件：1 \\leq i &lt; j \\leq M / i 本目の直線と j 本目の直線は交わる\u003c/p>"},{"id":"abc401_c","title":"C - K-bonacci","url":"https://atcoder.jp/contests/abc401/tasks/abc401_c?lang=ja","summary":"\u003cp>正整数 N,K が与えられます。長さ N+1 の数列 A=(A_0,A_1,\\ldots,A_N) の各要素の値を、以下の方法で定義します。 問：A_N を 10^9 で割ったあまりを求めてください。 条件：0\\leq i&lt;K のとき、 A_i=1 / K\\leq i のとき、 A_i=A_{i-K}+A_{i-K+1}+\\ldots+A_{i-1}\u003c/p>"},{"id":"abc401_d","title":"D - Logical Filling","url":"https://atcoder.jp/contests/abc401/tasks/abc401_d?lang=ja","summary":"\u003cp>. , o , ? のみからなる長さ N の文字列 S が与えられます。 全ての ? をそれぞれ . または o で置き換えて得られる文字列のうち、以下の条件を全て満たすものの集合を X とします。 X が空集合でないことは保証されます。 問：以下を満たす、長さ N の文字列 T を出力して下さい。ここで、 T の左から i 番目の文字を T_i と表記します。 条件：o の個数がちょうど K 個 / o が連続しない\u003c/p>"},{"id":"abc400_c","title":"C - 2^a b^2","url":"https://atcoder.jp/contests/abc400/tasks/abc400_c?lang=ja","summary":"\u003cp>正の整数 X は、次の条件をみたすときかつその時に限り、良い整数と呼ばれます。 例えば、 400 は 400=2^2\\times 10^2 と書けるため、良い整数です。 問：正の整数 N が与えられるので、 1 以上 N 以下の良い整数の個数を求めてください。 条件：正の整数の組 (a,b) を用いて、 X=2^a\\times b^2 と書ける。\u003c/p>"},{"id":"abc400_d","title":"D - Takahashi the Wall Breaker","url":"https://atcoder.jp/contests/abc400/tasks/abc400_d?lang=ja","summary":"\u003cp>高橋君は魚屋にウナギを買いに行こうとしています。 高橋君の住む町は縦 H マス横 W マスからなるグリッド状の区画に分かれており、 各区画は道か壁かのいずれかです。 以下、上から i 番目 (1\\leq i \\leq H) かつ左から j 番目 (1\\leq j\\leq W) の… 問：高橋君は最初、区画 (A,B) におり、区画 (C,D) にある魚屋まで移動したいです。 ここで、高橋君の最初にいる区画および魚屋のある区画は道であることが保証されます。 高橋君が魚屋にたどり着くために必要な 前蹴りの回数 の最小値を求めてください。 条件：上下左右に隣接する、町の中の区画であって、道であるようなものに移動する。 / 上下左右の方向を一つ決め、その方向に 前蹴り を行う。\u003c/p>"},{"id":"abc399_c","title":"C - Make it Forest","url":"https://atcoder.jp/contests/abc399/tasks/abc399_c?lang=ja","summary":"\u003cp>頂点に 1 から N の番号がついた N 頂点 M 辺の単純無向グラフが与えられます。 i 番目の辺は頂点 u_i と頂点 v_i を結ぶ辺です。 グラフを森にするためには辺を最低何本削除する必要がありますか？\u003c/p>"},{"id":"abc399_d","title":"D - Switch Seats","url":"https://atcoder.jp/contests/abc399/tasks/abc399_d?lang=ja","summary":"\u003cp>N 組のカップルが一列に座っています。 2 組のカップルであって、もともと両方のカップルは隣り合わせで座っておらず、かつ 4 人の間で席を交換することで両方のカップルが隣り合わせで座れるようになる組の個数を数えてください。 長さ 2N の数列 A=(A_1,A_2,\\dots,A_{2N}) があります。 A には 1, 2, \\dots, N がそれぞれ 2 回ずつ登場します。 問：T 個のテストケースが与えられるので、それぞれに対して答えを求めてください。 条件：A 内において a 同士は隣接していない。 / A 内において b 同士は隣接していない。\u003c/p>"},{"id":"abc398_c","title":"C - Uniqueness","url":"https://atcoder.jp/contests/abc398/tasks/abc398_c?lang=ja","summary":"\u003cp>1 から N の番号がついた N 人の人がいます。人 i は数 A_i を持っています。 問：「自分と同じ数を持っている人が自分以外の N-1 人の中に存在しない」という条件を満たす人のうち、持っている数が最大である人の番号を求めてください。\u003c/p>"},{"id":"abc398_d","title":"D - Bonfire","url":"https://atcoder.jp/contests/abc398/tasks/abc398_d?lang=ja","summary":"\u003cp>無限に広い 2 次元グリッドがあり、このグリッドの座標 (0,0) に焚き火があります。 時刻 t=0 では、マス (0,0) にのみ煙が存在します。 N , W , S , E からなる長さ N の文字列 S が与えられ、時刻 t=1,2,\\dots,N では次の現象が順番に発生します。 問：高橋君はマス (R,C) に立っています。 整数 1 \\le t \\le N について、時刻 t+0.5 においてマス (R,C) に煙が存在するか判定し、出力欄の形式に従って出力してください。 条件：風が吹き、現時点で存在する全ての煙が以下の通りに移動する。 S の t 文字目が N であるとき、マス (r,c) にある煙がマス (r-1,c) に移動する。\u003c/p>"},{"id":"abc397_c","title":"C - Variety Split Easy","url":"https://atcoder.jp/contests/abc397/tasks/abc397_c?lang=ja","summary":"\u003cp>この問題は F 問題の簡易版です。 長さ N の整数列 A=(A_1,A_2,\\ldots,A_N) が与えられます。 問：より厳密には、 1 \\leq i \\leq N-1 を満たす整数 i について (A_1,A_2,\\ldots,A_i), (A_{i+1},A_{i+2},\\ldots,A_N) のそれぞれに含まれる整数の種類数の和としてありえる最大値を求めてください。\u003c/p>"},{"id":"abc397_d","title":"D - Cubes","url":"https://atcoder.jp/contests/abc397/tasks/abc397_d?lang=ja","summary":"\u003cp>正整数 N が与えられます。 x^{3}-y^{3}=N を満たす正整数の組 (x,y) が存在するか判定し、存在する場合はそのような (x,y) を一つ出力してください。\u003c/p>"},{"id":"abc396_c","title":"C - Buy Balls","url":"https://atcoder.jp/contests/abc396/tasks/abc396_c?lang=ja","summary":"\u003cp>N 個の黒色のボールと M 個の白色のボールがあります。 ボールにはそれぞれ価値がつけられており、 i\\ (1\\leq i\\leq N) 個目の黒色のボールの価値は B_i 、 j\\ (1\\leq j\\leq M) 個目の白色のボールの価値は W_j です。 問：黒色のボールの個数が白色のボールの個数以上になるようにボールを 0 個以上選ぶとき、選んだボールの価値の総和としてありうる最大値を求めてください。\u003c/p>"},{"id":"abc396_d","title":"D - Minimum XOR Path","url":"https://atcoder.jp/contests/abc396/tasks/abc396_d?lang=ja","summary":"\u003cp>頂点に 1 から N の、辺に 1 から M の番号がついた N 頂点 M 辺の単純連結無向グラフが与えられます。辺 i は頂点 u_i と頂点 v_i を結んでおり、ラベル w_i が付けられています。 問：頂点 1 から頂点 N への単純パス（同じ頂点を 2 度以上通らないパス）のうち、パスに含まれる辺につけられたラベルの総 XOR としてあり得る最小値を求めてください。 条件：A \\oplus B を二進表記した際の 2^k \\, (k \\geq 0) の位の数は、 A,B を二進表記した際の 2^k の位の数のうち一方のみが 1 であれば 1 、そうでなければ 0 である。\u003c/p>"},{"id":"abc395_c","title":"C - Shortest Duplicate Subarray","url":"https://atcoder.jp/contests/abc395/tasks/abc395_c?lang=ja","summary":"\u003cp>正整数 N と、長さ N の整数列 A=(A_1,A_2,\\dots,A_N) が与えられます。 問：A の空でない連続部分列であって、同じ値を複数個含むようなものが存在するか判定してください。存在するならばそのようなもののうち最も短いものの長さを求めてください。\u003c/p>"},{"id":"abc395_d","title":"D - Pigeon Swap","url":"https://atcoder.jp/contests/abc395/tasks/abc395_d?lang=ja","summary":"\u003cp>鳩 1, 鳩 2,\\ldots, 鳩 N の N 羽の鳩と、巣 1, 巣 2,\\ldots, 巣 N の N 個の巣があります。 はじめ、鳩 i (1\\leq i\\leq N) は巣 i にいます。 問：Q 回の操作を順に行ったときの、種類 3 の各操作における報告の結果を出力してください。 条件：種類 1 : 整数 a,b (1\\leq a\\leq N,1\\leq b\\leq N) が与えられる。鳩 a を今いる巣から取り出し、巣 b へ移動する。\u003c/p>"},{"id":"abc394_c","title":"C - Debug","url":"https://atcoder.jp/contests/abc394/tasks/abc394_c?lang=ja","summary":"\u003cp>英大文字のみからなる文字列 S が与えられます。 S に対して、次の手順を行った後に得られる文字列を出力してください。 文字列が WA を（連続する）部分文字列として含む限り、次の操作を繰り返す。 条件：文字列中に登場する WA のうち最も先頭のものを AC に置換する。\u003c/p>"},{"id":"abc394_d","title":"D - Colorful Bracket Sequence","url":"https://atcoder.jp/contests/abc394/tasks/abc394_d?lang=ja","summary":"\u003cp>6 種類の文字、 ( , ) , [ , ] , &lt; , &gt; からなる文字列 S が与えられます。 ここで、文字列 T は、以下の条件を満たすときカラフル括弧列と呼ばれます。 問：S がカラフル括弧列であるか判定してください。 条件：T の（連続する）部分文字列であって、 () , [] , &lt;&gt; のいずれかであるようなものが存在するとき、そのうちの 1 つを選んで削除する。 / 削除された部分文字列が T の先頭または末尾であるとき、残りの文字列を新たに T とする。\u003c/p>"},{"id":"abc393_c","title":"C - Make it Simple","url":"https://atcoder.jp/contests/abc393/tasks/abc393_c?lang=ja","summary":"\u003cp>頂点に 1 から N の、辺に 1 から M の番号がついた N 頂点 M 辺の無向グラフが与えられます。辺 i は頂点 u_i と頂点 v_i を結ぶ辺です。 グラフから辺を取り除いてグラフを単純にするためには、少なくとも何本の辺を取り除く必要がありますか？ ここでグラフが単純であるとは、グラフが自己ループや多重辺を含まないことをいいま…\u003c/p>"},{"id":"abc393_d","title":"D - Swap to Gather","url":"https://atcoder.jp/contests/abc393/tasks/abc393_d?lang=ja","summary":"\u003cp>0 および 1 からなる長さ N の文字列 S が与えられます。 ここで、 S には 1 が 1 つ以上含まれることが保証されます。 あなたは、以下の操作を繰り返し（ 0 回でも良い）行うことができます。 問：すべての 1 がひとかたまりになった状態にするために必要な操作回数の最小値を求めてください。 条件：1\\leq i\\leq N-1 を満たす整数 i を選び、 S の i 文字目と i+1 文字目を入れ替える。\u003c/p>"},{"id":"abc392_c","title":"C - Bib","url":"https://atcoder.jp/contests/abc392/tasks/abc392_c?lang=ja","summary":"\u003cp>1 から N の番号がついた N 人の人がいます。 人 i は数 Q_i が書かれたゼッケンを着けており、人 P_i を見つめています。 問：i が書かれたゼッケンを着けている人が見つめている人の着けているゼッケンにかかれている数を、 i=1,2,\\ldots,N のそれぞれについて求めてください。\u003c/p>"},{"id":"abc392_d","title":"D - Doubles","url":"https://atcoder.jp/contests/abc392/tasks/abc392_d?lang=ja","summary":"\u003cp>N 個のサイコロがあります。 i 番目のサイコロは K_i 個の面をもち、各面にはそれぞれ A_{i,1},A_{i,2},\\ldots,A_{i,K_i} が書かれています。このサイコロを振ると、各面がそれぞれ \\frac{1}{K_i} の確率で出ます。 問：あなたは N 個のサイコロから 2 個を選んで振ります。サイコロを適切に選んだときの、 2 つのサイコロの出目が等しくなる確率の最大値を求めてください。\u003c/p>"},{"id":"abc391_c","title":"C - Pigeonhole Query","url":"https://atcoder.jp/contests/abc391/tasks/abc391_c?lang=ja","summary":"\u003cp>N 匹の鳩がおり、 1 から N までの番号がつけられています。また、 N 個の巣があり、 1 から N までの番号がつけられています。はじめ、鳩 i は巣 i にいます (1\\leq i\\leq N) 。 問：Q 個のクエリが与えられるので順に処理してください。 クエリは 2 種類あり、以下のいずれかの形式で与えられます。 条件：1 P H : 鳩 P を巣 H に移動させる。 / 2 : 複数の鳩がいる巣の個数を出力する。\u003c/p>"},{"id":"abc391_d","title":"D - Gravity","url":"https://atcoder.jp/contests/abc391/tasks/abc391_d?lang=ja","summary":"\u003cp>10^9 行 W 列のグリッドがあります。左から x 列目、 下から y 行目のマスを (x,y) と表します。 N 個のブロックがあります。各ブロックは 1 \\times 1 の正方形で、ブロック i (1 \\leq i \\leq N) は時刻 0 にマス (X_i,Y_i) にあります。 問：Q 個の質問が与えられます。 j 番目 (1 \\leq j \\leq Q) の質問では、時刻 T_j+0.5 にブロック A_j が存在するかどうか答えてください。 条件：グリッドの下から 1 行目がすべてブロックで埋まっているならば、下から 1 行目にあるブロックをすべて消滅させる。 / 残っているブロックについて、下にあるブロックから順番に、以下の操作を行う。\u003c/p>"},{"id":"abc390_c","title":"C - Paint to make a rectangle","url":"https://atcoder.jp/contests/abc390/tasks/abc390_c?lang=ja","summary":"\u003cp>H 行 W 列のマス目が与えられます。 以下、上から i 行目 (1\\leq i\\leq H) かつ左から j 列目 (1\\leq j\\leq W) のマスをマス (i,j) で表します。 マス目の状態は H 個の長さ W の文字列 S_1,S_2, \\ldots, S_H によって以下のように表されます。 高橋君はまだ塗られていないマスをそれぞれ白または黒で塗ることで、黒マス全体が長方形をなすようにしたいです。 より具体的には、ある 4 つの整数の組 (a,b,c,d) ( 1\\leq a\\leq b\\leq H , 1\\leq c… 問：そのようなことが可能か判定してください。 条件：S_i の j 文字目が # のとき、マス (i,j) は黒く塗られている。 / S_i の j 文字目が . のとき、マス (i,j) は白く塗られている。\u003c/p>"},{"id":"abc390_d","title":"D - Stone XOR","url":"https://atcoder.jp/contests/abc390/tasks/abc390_d?lang=ja","summary":"\u003cp>袋 1 , 袋 2 , \\ldots , 袋 N と番号づけられた N 個の袋があります。 袋 i (1\\leq i\\leq N) には A_i 個の石が入っています。 高橋君は次の操作を好きなだけ（ 0 回でも良い）繰り返すことができます。 問：操作を繰り返した後の状態における次の値としてあり得るものが何個あるか求めてください。 条件：袋 i に入っている石の個数を B_i として、 B_1\\oplus B_2\\oplus\\cdots\\oplus B_N の値。 ただし、 \\oplus は排他的論理和を表す。\u003c/p>"},{"id":"abc389_c","title":"C - Snake Queue","url":"https://atcoder.jp/contests/abc389/tasks/abc389_c?lang=ja","summary":"\u003cp>ヘビの待ち行列があります。最初、列は空です。 問：クエリが Q 個与えられるので、与えられた順に処理してください。クエリは以下の 3 種類です。 条件：タイプ 1 : 1 l の形式で与えられる。長さ l のヘビが列の末尾に追加される。このとき追加するヘビの頭の位置は、元の列が空の場合は座標 0 、そうでない場合は最後尾のヘビの頭の座標に最後尾のヘビの長さを加えた座標となる。\u003c/p>"},{"id":"abc389_d","title":"D - Squares in Circle","url":"https://atcoder.jp/contests/abc389/tasks/abc389_d?lang=ja","summary":"\u003cp>二次元座標平面上に 1\\times 1 の正方形が無限に敷き詰められています。 ある正方形の中心を中心として、半径 R の円を描いたとき、円に完全に内包される正方形は何個あるでしょうか？ 問：より厳密には、整数組 (i,j) であって、 4 点 (i+0.5,j+0.5),(i+0.5,j-0.5),(i-0.5,j+0.5),(i-0.5,j-0.5) 全てが原点との距離が R 以下という条件を満たすものの個数を求めてください。\u003c/p>"},{"id":"abc388_c","title":"C - Various Kagamimochi","url":"https://atcoder.jp/contests/abc388/tasks/abc388_c?lang=ja","summary":"\u003cp>N 個の餅が小さいほうから順に並んでいます。 i 番目 (1\\leq i\\leq N) の餅の大きさは A _ i です。 2 つの餅 A,B の大きさをそれぞれ a,b としたとき、 a が b の半分以下であるとき、かつそのときに限り、餅 A を餅 B の上に乗せて鏡餅を 1 つ作ることができます。 問：ただし、鏡餅を構成する餅の大きさが同じでも、少なくとも一方が異なる餅であれば別の種類の鏡餅として数えます。\u003c/p>"},{"id":"abc388_d","title":"D - Coming of Age Celebration","url":"https://atcoder.jp/contests/abc388/tasks/abc388_d?lang=ja","summary":"\u003cp>ある星には N 人の宇宙人がおり、全員未成年です。 i 人目の宇宙人は現在 A_i 個の石を所持しており、ちょうど i 年後に成人します。 問：N 年後に各宇宙人が所持している石の個数を求めてください。\u003c/p>"},{"id":"abc387_c","title":"C - Snake Numbers","url":"https://atcoder.jp/contests/abc387/tasks/abc387_c?lang=ja","summary":"\u003cp>10 以上の正整数のうち、十進数表記したときに先頭の桁（最も大きい位）の数字がそれ以外のどの桁の数字よりも真に大きくなるようなものを ヘビ数 とよびます。 例えば、 31 や 201 はヘビ数ですが、 35 や 202 はヘビ数ではありません。 問：L 以上 R 以下のヘビ数が何個あるか求めてください。\u003c/p>"},{"id":"abc387_d","title":"D - Snaky Walk","url":"https://atcoder.jp/contests/abc387/tasks/abc387_d?lang=ja","summary":"\u003cp>H 行 W 列のグリッドがあります。 上から i 行目、左から j 列目のマスを (i,j) と表記します。 各マスはスタートマス・ゴールマス・空きマス・障害物マスのいずれかであり、その情報は H 個の長さ W の文字列 S_1,S_2,\\dots,S_H によって表されます。 問：より形式的には、以下の条件をすべて満たすマスの列 (i_1,j_1),(i_2,j_2),\\dots,(i_k,j_k) が存在するか判定し、存在するならば k-1 の最小値を求めてください。 条件：すべての 1\\leq l\\leq k について、 1\\leq i_l\\leq H かつ 1\\leq j_l\\leq W であり、 (i_l,j_l) は障害物マスでない / (i_1,j_1) はスタートマス\u003c/p>"},{"id":"abc386_c","title":"C - Operate 1","url":"https://atcoder.jp/contests/abc386/tasks/abc386_c?lang=ja","summary":"\u003cp>この問題は F 問題 (Operate K) の部分問題であり、 K=1 です。 F 問題に正解するコードをこの問題に提出することで、この問題に正解できます。 問：文字列 S に対して以下の操作を 0 回以上 K 回以下行って、文字列 T と一致させられるか判定してください。 条件：次の 3 種類の操作のうちひとつを選択し、実行する。 S 中の (先頭や末尾を含む) 任意の位置に、任意の文字を 1 つ挿入する。 S 中の文字を 1 つ選び、削除する。 S 中の文字を 1 つ選び、別の 1 つの文字に変更する。\u003c/p>"},{"id":"abc386_d","title":"D - Diagonal Separation","url":"https://atcoder.jp/contests/abc386/tasks/abc386_d?lang=ja","summary":"\u003cp>N 行 N 列のグリッドがあります。高橋君は以下の条件を満たすように各マスを黒または白のいずれかに塗り分けたいと考えています。 M 個のマスがすでに塗られています。そのうち i 個目は上から X_i 行目、左から Y_i 列目のマスで、 C_i が B のとき黒で、 W のとき白で塗られています。 問：高橋君はまだ塗られていない残りの N^2-M 個のマスの色をうまく決めることで条件を満たすことができるか判定してください。 条件：すべての行について以下の条件が成り立つ。 / ある整数 i\\ (0\\leq i\\leq N) が存在して、その行の左から i 個のマスは黒、それ以外は白で塗られている。\u003c/p>"},{"id":"abc385_c","title":"C - Illuminate Buildings","url":"https://atcoder.jp/contests/abc385/tasks/abc385_c?lang=ja","summary":"\u003cp>N 棟のビルが等間隔に一列に並んでいます。手前から i 番目のビルの高さは H_i です。 あなたは次の条件をともに満たすようにいくつかのビルを選んで電飾で飾ろうとしています。 問：最大でいくつのビルを選ぶことができますか？ なお、ちょうど 1 つのビルを選んだときは条件を満たすとみなします。 条件：選んだビルたちは高さが等しい / 選んだビルたちは等間隔に並んでいる\u003c/p>"},{"id":"abc385_d","title":"D - Santa Claus 2","url":"https://atcoder.jp/contests/abc385/tasks/abc385_d?lang=ja","summary":"\u003cp>2次元平面上の N 点 (X_1,Y_1),\\ldots,(X_N,Y_N) に家が建っています。 最初、点 (S_x,S_y) にサンタクロースがいます。サンタクロースは列 (D_1,C_1),\\ldots,(D_M,C_M) に従って以下の行動を行います。 問：行動を終えたあとにサンタクロースがいる点と、行動により通過または到達した家の数を求めてください。ただし、同じ家を複数回通過または到達してもそれらは重複して数えません。 条件：i=1,2,\\ldots,M の順に以下のように移動する。 現在サンタクロースがいる点を (x,y) とする。 D_i が U なら、 (x,y) から (x,y+C_i) に直線で移動する。\u003c/p>"},{"id":"abc384_c","title":"C - Perfect Standings","url":"https://atcoder.jp/contests/abc384/tasks/abc384_c?lang=ja","summary":"\u003cp>高橋くんは、プログラミングコンテストを主催することにしました。 コンテストは A 問題、B 問題、C 問題、D 問題、E 問題の 5 問からなり、それぞれの配点は a 点、 b 点、 c 点、 d 点、 e 点です。 問：ただし、同じ点数を獲得した参加者については、名前が辞書順で小さいほうを先に出力してください。 条件：S の長さ |S| が T の長さより短く、 T の先頭 |S| 文字が S と一致する / ある整数 1\\leq i\\leq\\min\\lbrace|S|,|T|\\rbrace が存在して、次の 2 つの条件を両方を満たす 1\\leq j\\…\u003c/p>"},{"id":"abc384_d","title":"D - Repeated Sequence","url":"https://atcoder.jp/contests/abc384/tasks/abc384_d?lang=ja","summary":"\u003cp>周期 N をもつ無限数列 A=(A _ 1,A _ 2,A _ 3,\\dotsc) の先頭 N 項 A _ 1,A _ 2,\\dotsc,A _ N が与えられます。 問：この数列の空でない連続する部分列のうち、和が S となるものが存在するか判定してください。\u003c/p>"}]</script>
<script>
const data=JSON.parse(document.getElementById('dataset').textContent);
const key='abc-cd-200-v1';
let progress={};
try{progress=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
const byId=id=>document.getElementById(id);
const saved=()=>{try{localStorage.setItem(key,JSON.stringify(progress))}catch(e){}};
let order=data.map(x=>x.id),index=0,flipped=false;
function decode(text){
 const d=document.createElement('div');d.innerHTML=text;
 return d.textContent||'';
}
function format(text){
 // Unicode fallbacks, so core math remains legible even without MathJax/CDNs.
 return decode(text).replace(/\\(?:ldots|dotsc|dots|cdots)/g,'…')
 .replace(/\\(?:leq|le)\b/g,'≤').replace(/\\(?:geq|ge)\b/g,'≥')
 .replace(/\\lt\b/g,'<').replace(/\\gt\b/g,'>').replace(/\\neq\b/g,'≠')
 .replace(/\\times\b/g,'×').replace(/\\oplus\b/g,'⊕')
 .replace(/\\infty\b/g,'∞').replace(/\\sum\b/g,'∑')
 .replace(/\\(?:lbrace|rbrace)\b/g,'')
 .replace(/\\(?:left|right|displaystyle|mathrm|mathbf)\b/g,'')
 .replace(/\\(?:frac|dfrac)\{([^{}]+)\}\{([^{}]+)\}/g,'($1)/($2)');
}
function options(){
 const filter=byId('filter').value;
 return order.map(id=>data.find(d=>d.id===id)).filter(x=>{
   const s=(progress[x.id]||{}).status||'';
   return filter==='all'||filter==='c'&&x.id.endsWith('_c')||filter==='d'&&x.id.endsWith('_d')||filter==='todo'&&!s||filter==='review'&&s==='review';
 });
}
function draw(){
 const visible=options(),item=visible[index];
 byId('mastery').textContent='理解済み '+data.filter(x=>(progress[x.id]||{}).status==='done').length+' / 200';
 byId('position').textContent=item?(index+1)+' / '+visible.length:'0問';
 byId('fill').style.width=visible.length?(100*(index+1)/visible.length)+'%':'0';
 byId('prev').disabled=index===0||!visible.length;byId('next').disabled=index>=visible.length-1;
 for(const id of ['again','know','flip'])byId(id).disabled=!item;
 if(!item){
   byId('front').hidden=false;byId('back').hidden=true;
   byId('title').textContent='該当するカードがありません';
   byId('summary').textContent='フィルターを変更してください。';
   byId('source').hidden=true;return;
 }
 byId('source').hidden=false;byId('source').href=item.url;
 byId('title').textContent=item.title;byId('back-title').textContent=item.title;
 byId('summary').textContent=format(item.summary);
 byId('memo').value=(progress[item.id]||{}).note||'';
 byId('front').hidden=flipped;byId('back').hidden=!flipped;
 byId('flip').textContent=flipped?'問題に戻る':'裏を見る';
}
function nav(dx){
 const visible=options();
 if(!visible.length)return;
 const next=Math.min(visible.length-1,Math.max(0,index+dx));
 if(next===index)return;
 index=next;flipped=false;draw();
 window.scrollTo({top:0,behavior:'instant'});
}
function flip(){if(!options()[index])return;flipped=!flipped;draw()}
function rate(value){
 const item=options()[index];if(!item)return;
 progress[item.id]={...progress[item.id],status:value};saved();
 const current=options();
 if(!current.length)index=0;
 else if(!current.some(x=>x.id===item.id))index=Math.min(index,current.length-1);
 else index=Math.min(index+1,current.length-1);
 flipped=false;draw();
}
byId('prev').onclick=()=>nav(-1);byId('next').onclick=()=>nav(1);
byId('flip').onclick=flip;byId('front').onclick=flip;
byId('again').onclick=()=>rate('review');
byId('know').onclick=()=>rate('done');
byId('filter').onchange=()=>{index=0;flipped=false;draw()};
byId('memo').oninput=()=>{
 const item=options()[index];if(!item)return;
 progress[item.id]={...progress[item.id],note:byId('memo').value};saved();
};
byId('front').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
byId('shuffle').onclick=()=>{
 const select=byId('shuffle'),active=select.classList.toggle('active');
 order=data.map(x=>x.id);
 if(active)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 index=0;flipped=false;draw();
};
let start=null;
byId('sheet').addEventListener('touchstart',e=>{
 if(e.touches.length===1)start={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
byId('sheet').addEventListener('touchend',e=>{
 if(!start||e.changedTouches.length!==1)return;
 const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;
 start=null;
 if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.25)nav(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1);
});
draw();
</script>
</body></html>
