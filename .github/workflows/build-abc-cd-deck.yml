name: Build ABC C/D 200 study deck
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/build_abc_cd_deck.py
      - name: Commit generated deck
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add public/abc_cd_200.html
          git diff --cached --quiet || (git commit -m "Generate ABC C/D 200 deck" && git push)
