<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABC227E DPシミュレーター</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;margin:0;padding:16px;background:#f8fafc;color:#172033}.panel{border:1px solid #cbd5e1;background:white;border-radius:12px;padding:14px;margin:12px 0}.tiles{display:flex;gap:7px;flex-wrap:wrap;min-height:48px}.tile{background:#e2e8f0;padding:10px 14px;border-radius:8px;font-weight:bold;font-size:22px}.done{background:#bbf7d0}.sub{color:#64748b;font-size:13px}.controls{display:flex;gap:8px}button{cursor:pointer;border:1px solid #94a3b8;background:#eff6ff;border-radius:8px;padding:10px;flex:1}button:disabled{opacity:.3}input{padding:8px;max-width:140px}h3{font-size:15px;margin:0 0 10px}#state{font-weight:bold;font-size:19px}</style><h2>ABC227 E：DP遷移を触って理解する</h2><p>次の文字を選ぶと、左に残っている文字を飛び越える。その個数が追加コスト！</p><div class="panel"><label>元の文字列 <input id="source" value="KEYKE" maxlength="12"></label> <button id="apply">変更</button><p class="sub">K・E・Yのみ、12文字まで</p></div><div class="panel"><h3>完成した文字列</h3><div class="tiles" id="done"></div></div><div class="panel"><h3>残っている文字（元の順番）</h3><div class="tiles" id="remain"></div></div><div class="panel"><h3>次の文字を選ぼう</h3><div class="controls" id="choices"></div></div><div class="panel"><h3>DP状態</h3><div id="state"></div><p id="detail"></p></div><div class="controls"><button id="undo">1手戻す</button><button id="reset">最初から</button></div><script>(()=>{let S='KEYKE',hist=[];const cs=['K','E','Y'],el=id=>document.getElementById(id);function render(){let pos=cs.map(c=>[...S].flatMap((x,i)=>x===c?[i]:[])),cnt=cs.map(c=>hist.filter(x=>x.ch===c).length),used=new Set(pos.flatMap((p,j)=>p.slice(0,cnt[j]))),rem=[...S].map((ch,i)=>({ch,i})).filter(x=>!used.has(x.i)),w=hist.reduce((a,x)=>a+x.cost,0);el('done').innerHTML=hist.map(x=>'<span class="tile done">'+x.ch+'</span>').join('')||'<span class="sub">まだ空っぽ</span>';el('remain').innerHTML=rem.map(x=>'<span class="tile">'+x.ch+'</span>').join('')||'<span class="sub">全部使い切った！</span>';el('state').textContent='dp['+[...cnt,w].join('][')+']';let last=hist[hist.length-1];el('detail').textContent=last?'直前：'+last.ch+'を選択。左に残っていた'+last.cost+'文字を飛び越えた。':'初期状態：dp[0][0][0][0] = 1';el('choices').innerHTML='';cs.forEach((ch,j)=>{let p=pos[j][cnt[j]],cost=p===undefined?null:rem.filter(x=>x.i<p).length,b=document.createElement('button');b.disabled=cost===null;b.textContent=ch+'（'+(cost===null?'使用済み':cost+'回')+'）';b.onclick=()=>{hist.push({ch,cost});render()};el('choices').appendChild(b)});el('undo').disabled=!hist.length;}el('undo').onclick=()=>{hist.pop();render()};el('reset').onclick=()=>{hist=[];render()};el('apply').onclick=()=>{let v=el('source').value.trim().toUpperCase();if(!/^[KEY]{1,12}$/.test(v)){alert('K E Yのみで入力してください');return}S=v;hist=[];render()};render()})();</script></html>
